<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- One per scheme, so the phone's status bar matches the page before any script runs. When
     someone picks a theme, the script repaints both from THEME_BG. -->
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f17" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa" />
<title>Agent OS</title>
<!-- The course tells every attendee to bookmark this on their phone before they leave the
     room. Without these it lands as a blank tile. Rebuild: node scripts/build-icons.mjs -->
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="Agent OS" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- The picture at the top of Today. The screen is drawn by the script once the repo has been read,
     so without this the browser would not ask for it until then. -->
<link rel="preload" as="image" href="/art/today-harbour.webp" fetchpriority="high" />
<style>
  /* Every colour on this page is one of these tokens, and a rule never writes a colour of its own.
     The board was dark-only with its colours typed into the rules, so a light theme was a hunt for
     hex values; this way it is one block of values, and tests/theme.test.mjs refuses a colour
     written anywhere else and measures every text colour against every surface it sits on.

     Dark comes FIRST: the icon builder and its test take the first background and accent in this
     file as the app's own colours. Light is written twice with the same values - once for a phone
     set to light that has made no choice here, once for someone who pressed the switch - and both
     come AFTER the dark block, because a media query adds no specificity and the later rule wins.

     --link is not --accent on purpose. The accent is red, and a red link reads as an error before
     it reads as a link. --agent-ink is how far an owner chip's agent hue is pulled toward the ink:
     nothing on the dark chip, where the palette's bright hues read fine, and most of the way on the
     light one, where amber and teal would be close to invisible. The --kpi tokens are the three
     number cards on Today. --on-art and --scrim are words laid over a picture and the wash under
     them; the pictures are the same in both themes, so these two are too. */
  :root {
    color-scheme: dark;
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #172033;
    --line: #232b3d;
    --chip: #1c2436;
    --ink: #eef1f7;
    --muted: #8d97ab;
    --accent: #f0596a;
    --accent-soft: #2a1820;
    --link: #9db8ff;
    --ok: #5fd3a6;
    --warn: #f5b14c;
    --bad: #f87171;
    --on-art: #f3f5fb;
    --scrim: rgba(6, 9, 15, .82);
    --agent-ink: 0%;
    --kpi-work: #5fd3a6;
    --kpi-agents: #a48bf5;
    --kpi-ledger: #f5b14c;
    --shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 20px 40px -24px rgba(0, 0, 0, .6);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #f5f6fa;
      --panel: #ffffff;
      --panel-2: #eef1f6;
      --line: #e1e5ee;
      --chip: #eaeef4;
      --ink: #172033;
      --muted: #5e6880;
      --accent: #be202e;
      --accent-soft: #fbe9eb;
      --link: #2b5cb8;
      --ok: #17785a;
      --warn: #9e5c00;
      --bad: #c62828;
      --on-art: #f3f5fb;
      --scrim: rgba(6, 9, 15, .82);
      --agent-ink: 60%;
      --kpi-work: #1f8f66;
      --kpi-agents: #6a4fd1;
      --kpi-ledger: #b8730c;
      --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 16px 32px -24px rgba(20, 30, 60, .25);
    }
  }
  /* Word for word the block above. The test holds them identical, so a value changed in one place
     cannot leave "light because my phone is" and "light because I chose it" looking different. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f6fa;
    --panel: #ffffff;
    --panel-2: #eef1f6;
    --line: #e1e5ee;
    --chip: #eaeef4;
    --ink: #172033;
    --muted: #5e6880;
    --accent: #be202e;
    --accent-soft: #fbe9eb;
    --link: #2b5cb8;
    --ok: #17785a;
    --warn: #9e5c00;
    --bad: #c62828;
    --on-art: #f3f5fb;
    --scrim: rgba(6, 9, 15, .82);
    --agent-ink: 60%;
    --kpi-work: #1f8f66;
    --kpi-agents: #6a4fd1;
    --kpi-ledger: #b8730c;
    --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 16px 32px -24px rgba(20, 30, 60, .25);
  }

  /* Inter, served from this site: the content security policy allows fonts from nowhere else, and
     a phone on conference wifi should not wait on a third party for its letters.
     @fontsource-variable/inter 5.3.0, files/inter-latin-wght-normal.woff2 (Latin, weights 100 to
     900), SHA-256 3100e775e8616cd2611beecfa23a4263d7037586789b43f035236a2e6fbd4c62. Under the SIL
     Open Font License 1.1, which travels with it as public/fonts/OFL.txt. swap: the words show at
     once in the fallback face and change when Inter lands, instead of being invisible while it
     loads. */
  @font-face {
    font-family: Inter;
    src: url('/fonts/inter-latin-var.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  /* --radius is a panel's corner; --radius-sm is everything that sits on one - buttons, inset cards,
     fields - so a card inside a panel never has the same curve as the panel around it. */
  :root {
    --radius: 16px;
    --radius-sm: 11px;
    --nav-row: 3.2rem;
    --nav-h: calc(var(--nav-row) * 2); /* the phone nav is two rows; see nav .tabs */
    --sidenav-w: 15rem;
  }
  * { box-sizing: border-box; }
  /* The profile, Run a job and the freshness dot are laid out as flex and hidden with the hidden
     attribute when there is nothing to show. Any class rule that sets display outranks the
     browser's own [hidden] rule, so without this the profile of nobody would be drawn. */
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 Inter, ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 1rem);
  }
  /* 44rem is a phone-and-tablet measure, and on a phone it is the right one. The desktop
     override is below, in the same media query that turns the nav into a sidebar - this cap was
     written when the page was phone-only, the sidebar was added later, and nothing ever lifted
     it. On a 1890px screen that left 176px of sidebar, 498px of nothing, 704px of content and
     513px more nothing: over half the window empty, with the task board squeezed into four
     168px columns. */
  .wrap { max-width: 44rem; margin: 0 auto; padding: 1rem 1rem 0; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -.01em; }
  /* A section heading is the mock-up's: a 21px heading with a small capital line over it, the pair
     wrapped in .section-head. It used to be small grey capitals on their own, which on a screen of
     panels read as a label for the panel rather than as the start of a part of the page. */
  h2 { font-size: 1.3125rem; margin: 2rem 0 .8rem; letter-spacing: -.03em; line-height: 1.2; color: var(--ink); font-weight: 600; }
  .section-head { margin: 2.1rem 0 .85rem; }
  .section-head > h2 { margin: .2rem 0 0; }
  .eyebrow {
    margin: 0; font-size: .625rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted);
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: .8125rem; margin: 0 0 .75rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  /* Words written straight into a panel, with no row of their own around them, used to touch its
     left border - the Usage line and the count of jobs nothing fires both did. */
  .panel > p { margin: 0; padding: .85rem 1.05rem; }
  .panel > p + p { padding-top: 0; }
  .card { padding: 1rem 1.1rem; }
  .card > p { padding: 0; }
  .card > p + p, .panel.empty > p { margin-top: .5rem; }
  .panel.empty > p { padding: 0; }
  .stack > .panel { margin-bottom: .75rem; }
  /* Two panels one after the other at the top level of a screen - the Ledger's number over "No
     ledger yet", the snapshot over an empty Workflows - sat edge to edge and read as one card. */
  .screen > .panel + .panel, .screen > .kpis + .panel { margin-top: .75rem; }
  .row { display: flex; flex-wrap: wrap; gap: .35rem .5rem; align-items: center; }
  .between { justify-content: space-between; }
  /* The mock-up's chip: a hairline round a word in small capitals. The fill stays, because every
     text colour is measured against --chip in tests/theme.test.mjs; a coloured chip tints its own
     outline toward its colour, so a warning reads as one from across the screen. */
  .chip {
    display: inline-flex; align-items: center; gap: .3rem;
    font-size: .6875rem; letter-spacing: .07em; text-transform: uppercase; line-height: 1.45;
    background: var(--chip); border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem; white-space: nowrap;
    color: var(--muted);
  }
  .chip.on { color: var(--ink); }
  .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
  .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  .chip.bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  /* Whose job this is, in that agent's own hue - handed in as --agent by ownerChipHtml. It used to
     arrive as a finished colour in a style attribute, which a light theme could not touch: amber on
     a near-white chip. The palette stays as it is (every team's colours hang off it), and the theme
     decides how far to pull the hue toward the ink so the name stays readable. */
  .chip.owner {
    color: color-mix(in srgb, var(--agent), var(--ink) var(--agent-ink));
    border: 1px solid color-mix(in srgb, var(--agent), var(--ink) var(--agent-ink));
  }
  /* A chip holding a name read from the repo, which has no length limit. "Plugin ·
     context7@claude-plugins-official" is 322px with no space to break at, so at 320 wide the Skills
     screen scrolled sideways. This one may wrap, and break inside a word when it has to; a short
     chip keeps the base rule's single line. `anywhere` rather than `break-word`, because the text
     inside an inline-flex chip is a flex item of its own and only `anywhere` lets it shrink. */
  .chip.wraps { white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
  .working .dot, .live .dot { background: var(--ok); }
  .quiet .dot, .attention .dot, .silent .dot { background: var(--warn); }
  .never-run .dot, .no-heartbeat .dot { background: var(--bad); }
  /* Not in use is a decision, not a fault - so it reads muted rather than red. */
  .not-in-use .dot { background: var(--muted); }
  .state { font-size: .75rem; font-weight: 600; color: var(--muted); }
  .working .state, .live .state { color: var(--ok); }
  .quiet .state, .attention .state, .silent .state { color: var(--warn); }
  .never-run .state, .no-heartbeat .state { color: var(--bad); }
  .not-in-use .state { color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: .8125rem; }
  /* There was no `.bad` rule at all. Five places in this page write `class="small bad"` for their
     worst sentence and every one of them rendered as ordinary body text, including the most serious
     sentence on the board - "A routine is firing for this and the file says it is off. It is
     spending runs nobody approved." Somebody's money, in the same grey as everything else.
     `.fire-note.bad` and `.never-run .state` both already point at this variable, so the intent was
     written down four times and the one rule that would carry it was missing. */
  .bad { color: var(--bad); }
  /* Somebody else's sentence, at whatever length they wrote it. Three lines on a phone is enough to
     read the reason; the whole thing is in the title attribute. overflow-wrap because a long word
     or a pasted address would otherwise push the card wider than the screen. */
  .clamp {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .empty { padding: 1rem; color: var(--muted); font-size: .875rem; }
  code { background: var(--chip); padding: .1rem .3rem; border-radius: 4px; font-size: .85em; }
  .title { font-size: .975rem; font-weight: 600; margin: 0; }
  /* The chain wraps rather than scrolling sideways. It used to be `nowrap; overflow-x: auto`, so
     at phone width a three-step chain was cut off mid-word - "review-dr" just stopped - with no
     ellipsis, no fade, nothing saying it could be swiped. It read as a rendering fault, and a
     sideways scroller inside a page that scrolls down is missed by a thumb anyway. This is the one
     screen whose whole job is saying what each job does, so the last step - usually the one that
     identifies it - is not something to hide. Wrapping costs a variable card height and nothing
     else. */
  .steps { color: var(--muted); font-size: .8125rem; margin: .3rem 0 .1rem; overflow-wrap: anywhere; }
  .steps b { color: var(--ink); font-weight: 500; }

  /* Screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Setup ladder */
  /* auto-fit, never a fixed count: this was repeat(5, 1fr) while the course taught six
     stages, so Improvement had nowhere to render. Same bug as seven nav tabs in six columns. */
  .ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.25rem, 1fr)); gap: .45rem .6rem; padding: 1rem 1.1rem 1.05rem; }
  .rung { text-align: center; font-size: .6875rem; color: var(--muted); }
  .rung .bar { height: .3rem; border-radius: 999px; background: var(--chip); margin-bottom: .35rem; }
  .rung.pass .bar { background: var(--ok); }
  .rung.pass { color: var(--ink); }

  /* Fire buttons */
  .fires { display: flex; flex-wrap: wrap; gap: .5rem; }
  /* Every button on the board is the mock-up's job button: a rounded tile on the panel colour with a
     hairline, the accent arriving only on hover. It was a filled block in --panel-2 with a panel's
     radius, so a row of them read as a row of small cards. */
  /* Choose a picture is a label drawn as one of these buttons, with the file input hidden inside it:
     a label opens its own input's picker wherever it is pressed, which a button cannot do for a
     file input, and the browser's own file box looks different on every phone. */
  button.fire, label.fire {
    font: inherit; font-size: .875rem; font-weight: 600;
    color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: .6rem 1rem; min-height: 2.9rem;
    display: inline-flex; align-items: center; gap: .5rem;
  }
  button.fire[disabled] { opacity: .55; }
  button.fire:not([disabled]) { cursor: pointer; }
  button.fire:not([disabled]):hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  button.fire:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  label.fire { position: relative; cursor: pointer; }
  label.fire:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  /* The keyboard lands on the hidden input, so its button shows where the keyboard is. */
  label.fire:focus-within { outline: 2px solid var(--link); outline-offset: 2px; }
  label.fire:has(> input[disabled]) { opacity: .55; }
  /* Out of sight, never out of reach: display: none would take the input away from the keyboard
     and from a screen reader as well. */
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  /* A run button: the job's name after a small play mark in the accent. The mark is drawn, because
     the character for it is one a phone may turn into an emoji. */
  button.job { font-weight: 500; padding: .5rem 1rem .5rem .55rem; gap: .6rem; }
  .play {
    display: grid; place-items: center; flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
  }
  .play svg { width: .6rem; height: .6rem; fill: currentColor; margin-left: .08rem; }
  .soon { font-size: .625rem; letter-spacing: .05em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: .05rem .4rem; }
  .fire-note { font-size: .8125rem; }
  .fire-note.ok { color: var(--ok); }
  .fire-note.bad { color: var(--bad); }

  /* Unlock — the whole page when the view key is missing or wrong. Phone-first: one
     field, one thumb-sized button, nothing else to read. */
  /* A panel of its own, in the same family as every card behind it. The page it replaces kept its
     room for the nav - the top padding on a phone, the sidebar's width on a laptop - so the card sat
     low on one and off to the right on the other; with the nav gone, so is the room. */
  body:has(> .unlock) { padding: 1rem; }
  .unlock {
    max-width: 24rem; margin: 18vh auto; padding: 1.5rem 1.4rem 1.2rem; text-align: left;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .unlock h1 { font-size: 1.6rem; letter-spacing: -.03em; margin: .3rem 0 .4rem; }
  .unlock p { color: var(--muted); font-size: .875rem; }
  .unlock .eyebrow { margin: 0; }
  #unlock-form { display: flex; gap: .5rem; margin: 1rem 0 .8rem; }
  #unlock-key {
    flex: 1; min-width: 0; min-height: 2.9rem; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: .6rem .75rem;
  }
  #unlock-key:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

  /* Add-task — an inline form at the top of the To do column. Phone-first: full-width
     fields, one thumb-sized submit button, no dialog. */
  .add-task { padding: .85rem .95rem; border-bottom: 1px solid var(--line); }
  /* Add task and New workflow, side by side when the column has room and one under the other when
     it does not. The gap spaces them both ways. It was a margin on the second button, which stayed
     on it after it wrapped and left it a step in from the first. */
  .add-open { display: flex; flex-wrap: wrap; gap: .5rem; }
  .add-open > .fire { flex: 1 1 auto; justify-content: center; }
  /* One class for every inline form on the board, rather than a block of rules per form id.
     There were two near-identical id blocks here - #task-form and #wf-form - and when Add skill
     and Add agent arrived they matched neither: the textarea rendered as a bare browser default
     on a dark page, on the phone and the desktop alike. Nothing caught it, because the render
     harness pulls out the page's inline script and never reads this stylesheet, so no test in
     this repo could see a CSS rule at all. Both halves are fixed: the rules are a class now, and
     a test walks every form the page emits and refuses one the stylesheet does not cover.
     (Naming a script or style tag literally in here would break that harness - its regex would
     start matching at the mention. That is why this comment describes them in words.) */
  .fire-form { display: grid; gap: .5rem; margin-top: .6rem; }
  .fire-form[hidden] { display: none; }
  .fire-form label { font-size: .75rem; font-weight: 600; color: var(--muted); }
  .fire-form textarea, .fire-form select {
    width: 100%; font: inherit; font-size: .875rem; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: .6rem .7rem;
  }
  .fire-form textarea { resize: vertical; min-height: 4.4rem; }
  .fire-form .row { flex-wrap: nowrap; }
  .fire-form select { flex: 1; min-width: 0; }
  /* On Today this block is one part of a board column and its bottom border separates it from the
     cards below. On Skills and Team it is the only child of a panel of its own, so that border
     lands directly on the panel's own bottom border - two hairlines, one gap apart - and .panel
     carries no margin, so the next panel starts flush against it and the two read as one fused
     card. Both are only visible on the two new screens, which is why they are fixed here and not
     on .panel or .add-task, where they would change Today. */
  .add-panel { margin-bottom: .75rem; }
  .add-panel .add-task { border-bottom: 0; }

  /* Week calendar - the Schedule strip with dates and outcomes. A pill is done when a run
     for that workflow landed that day, missed when the day has passed without one. */
  .day.today .dayname { color: var(--ink); font-weight: 700; }
  .daydate { font-size: .68rem; color: var(--muted); font-weight: 400; }
  .pill .mark { font-size: .72rem; margin-left: .3rem; }
  .pill.done .mark { color: var(--ok); }
  .pill.missed { opacity: .55; }
  .pill.missed .mark { color: var(--bad); }
  .cal-key { display: flex; gap: .9rem; flex-wrap: wrap; margin-top: .5rem; font-size: .72rem; color: var(--muted); }

  /* Board — four columns stack on a phone (one-handed rule), pair up on medium screens,
     and sit side by side only when there is genuinely room for four. */
  /* Each column is a panel and each card an inset tile inside it, as in the mock-up. They were rows
     ruled off by hairlines, which made a column one long list rather than a stack of things. The
     card's left edge is wider so the owner's colour, handed in by accentStyle, still reads. */
  .board { display: grid; grid-template-columns: 1fr; gap: .75rem; }
  @media (min-width: 48rem) { .board { grid-template-columns: repeat(2, 1fr); align-items: start; } }
  @media (min-width: 64rem) { .board { grid-template-columns: repeat(4, 1fr); } }
  .col { padding: .9rem; }
  .board .col-title { display: flex; justify-content: space-between; align-items: baseline; padding: 0 .1rem .7rem; font-size: .625rem; text-transform: uppercase; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
  .board .kcard {
    padding: .7rem .8rem; font-size: .8125rem;
    background: var(--panel-2); border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--radius-sm);
  }
  .board .kcard + .kcard, .board .add-task + .kcard { margin-top: .5rem; }
  .col > .add-task { padding: 0 0 .8rem; margin-bottom: .8rem; }
  /* An empty column is a dashed tile where the cards would be, rather than loose words. */
  .col > .empty { padding: .75rem .8rem; border: 1px dashed var(--line); border-radius: var(--radius-sm); font-size: .8125rem; }
  .board .kcard .summary { margin: .15rem 0 0; font-size: .8125rem; color: var(--muted); }
  /* Start / Done on a task card, and what the card says while the change is in flight. */
  .board .kcard .row.between + .row.between { margin-top: .4rem; }
  /* Start and Done were 2.25rem, 36px: the smallest buttons on the board on the cards a thumb
     presses most. 2.75rem is the 44px every other control here already clears. */
  .small-fire { font-size: .75rem; padding: .3rem .7rem; min-height: 2.75rem; }
  .move-note { margin-top: .4rem; }
  .move-note.ok { color: var(--ok); }
  .move-note.bad { color: var(--bad); }
  /* Dimmed, not moved: the card is still whatever the repo says until the commit lands. */
  .board .kcard.pending { opacity: .6; }
  .board .kcard.done-task .summary { font-style: italic; }
  .finished-tasks { margin-top: .6rem; border-top: 1px solid var(--line); }
  .finished-tasks > summary { padding: .7rem .1rem .5rem; min-height: 2.75rem; cursor: pointer; color: var(--muted); }
  .finished-tasks[open] > summary { margin-bottom: .35rem; }
  .st { font-weight: 700; }
  .st-ok { color: var(--ok); }
  .st-partial, .st-blocked { color: var(--warn); }
  .st-failed { color: var(--bad); }

  /* Run list */
  .run { padding: .8rem 1.05rem; border-bottom: 1px solid var(--line); }
  .run:last-child { border-bottom: 0; }
  .run .summary { margin: .2rem 0 0; font-size: .875rem; color: var(--muted); }

  /* Measured in Chromium at 375x667: every other control on the board cleared 32px and this one
     was 34x17. It is also the only control that goes from a phone to the live transcript of a
     run, which makes it the worst one to have to aim at. */
  a.watch {
    display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 .5rem;
    margin: -.6rem 0; font-weight: 600;
  }

  /* Same measurement, same fix: a skill's name is the link that opens the file, and it was 23px
     tall. Anything on this page that is meant to be tapped gets the thumb target. */
  a.title[data-open] { display: inline-flex; align-items: center; min-height: 2.75rem; }

  h3.group { margin: 1.5rem 0 .15rem; font-size: 1rem; letter-spacing: -.01em; }
  .group-note { margin: 0 0 .45rem; }

  /* A row in a list of skills. The Team screen used this too until its agents became cards. */
  .agent { padding: .95rem 1.05rem; border-bottom: 1px solid var(--line); }
  .agent:last-child { border-bottom: 0; }

  /* Team: one card per agent, the portrait on top and its state on a pill over the picture.
     auto-fill with a 15rem floor is one column on a phone and four on a laptop with no query of
     its own. align-items: start because a grid row stretches to its tallest item - without it,
     opening one card to read its runs would pull every card beside it down to the same length. */
  .team-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .9rem;
    align-items: start; margin-top: .9rem;
  }
  .agent-card {
    overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--panel); box-shadow: var(--shadow);
  }
  .agent-card > summary { display: block; list-style: none; cursor: pointer; }
  .agent-card > summary::-webkit-details-marker { display: none; }
  .agent-card > summary:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
  /* The agent's initial on its own palette colour sits UNDER every portrait, not only where there
     is none: it is what shows while a lazy picture is still on its way, and what is left when one
     fails and the script takes it away. */
  .portrait { position: relative; display: block; aspect-ratio: 4 / 3; overflow: hidden; background: var(--panel-2); }
  .portrait-tile {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 2.6rem; font-weight: 600; letter-spacing: -.04em; color: var(--ink);
    background: radial-gradient(80% 80% at 50% 35%, color-mix(in srgb, var(--agent) 45%, transparent), transparent 70%), var(--panel-2);
  }
  .portrait-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  /* The pill is a slice of the card's own surface, so the state keeps the colour it is measured
     against in both themes rather than a green or amber laid straight over a picture. */
  .status-pill {
    position: absolute; top: .6rem; left: .6rem; display: inline-flex; align-items: center; gap: .4rem;
    padding: .22rem .6rem; border-radius: 999px;
    background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(6px);
  }
  .agent-body { display: block; padding: .8rem .95rem .95rem; }
  .agent-card .title { text-transform: capitalize; overflow-wrap: anywhere; }
  /* An agent the owner has named: the name large, and the slug kept under it, smaller, because the
     slug is what every job and task card still calls it. Below the rule it narrows. The name is the
     owner's own words, so it keeps the case they typed it in. */
  .display-name {
    display: block; margin: 0 0 .2rem; font-size: 1.2rem; font-weight: 650; line-height: 1.2;
    letter-spacing: -.02em; overflow-wrap: anywhere;
  }
  .agent-card.named .title { font-size: .8125rem; font-weight: 500; color: var(--muted); }
  .agent-card p.desc { margin: .35rem 0 .5rem; color: var(--muted); font-size: .8125rem; }
  /* The card opens to show what this agent actually did. The marker above is hidden, and a
     `cursor: pointer` is invisible on the phone this board is built to be read on - so on the
     device that matters there was nothing at all saying a tap did anything. This is that sign. */
  .agent-card .runcount { display: block; margin-top: .35rem; color: var(--muted); font-size: .75rem; }
  .agent-card .chev { display: inline-block; margin-left: .35rem; transition: transform .15s ease; }
  .agent-card[open] .chev { transform: rotate(90deg); }
  .agent-runs { border-top: 1px solid var(--line); }
  /* Add agent sits at the TOP of Team, under the banner and above the cards. It was the last tile
     of the grid, as in the mock-up, which on a phone put it after eight tall portraits - so most
     people never learned they could add an agent at all. One button in the accent, so it reads as
     the thing to do here; the form it opens is the same one as everywhere else. The grid's own top
     margin spaces it from the cards, so this one only takes the room above. */
  .team-banner + .add-panel { margin: .9rem 0 0; }
  #agent-open {
    width: 100%; justify-content: center;
    background: var(--accent-soft); color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
  }
  #agent-open:hover { border-color: var(--accent); }

  /* Personalise: a card's own section in its drawer, ruled off from the runs above it; the picture
     controls each banner opens under itself; and Make it yours, opened under the Team banner. Each
     is a panel or a slice of one, in the same family as the Add agent form beside it. */
  .personalise { display: grid; gap: .6rem; padding: .85rem .95rem 1rem; border-top: 1px solid var(--line); }
  .personalise > .eyebrow, .banner-personalise > .eyebrow, .brand-panel > .eyebrow { margin: 0; }
  .banner-personalise, .brand-panel { display: grid; gap: .6rem; margin-top: .9rem; padding: .9rem 1rem 1rem; }
  .brand-panel > p, .banner-personalise > p { padding: 0; }
  .banner-personalise + .add-panel, .brand-panel + .add-panel { margin-top: .9rem; }
  .picture-controls { display: grid; gap: .55rem; }
  .picture-controls > .fire-form { margin-top: 0; }
  .allowance { margin: 0; font-size: .75rem; }
  .no-change-left { display: block; font-size: .75rem; }
  .brand-field {
    flex: 1; min-width: 0; min-height: 2.9rem; font: inherit; font-size: .9375rem; color: var(--ink);
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: .55rem .75rem;
  }
  .brand-field:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  /* A button laid over a banner picture: the words over-the-art colour on the same wash as the setup
     pill, so it reads on a bright sky as well as a dark one. Written as button.banner-btn so it
     outranks button.fire, which it follows. */
  button.banner-btn {
    min-height: 2.75rem; padding: .45rem .95rem; font-size: .8125rem;
    color: var(--on-art); background: color-mix(in srgb, var(--scrim) 70%, transparent);
    border: 1px solid color-mix(in srgb, var(--on-art) 22%, transparent); backdrop-filter: blur(8px);
  }
  button.banner-btn[aria-expanded="true"] { border-color: var(--on-art); }

  /* Memory */
  input[type=search] {
    width: 100%; font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .65rem .9rem; min-height: 2.9rem;
    box-shadow: var(--shadow);
  }
  input[type=search]:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  /* Wraps rather than scrolling sideways. At 390px this row is 804px of chips in 358px, so SEVEN
     of the twelve filters sat off-screen - including `shared`, which holds the business brain and
     18 of this repo's 59 pages. Worse than the step chain on the Workflows screen, which at least
     stopped mid-word: a chip boundary happens to land near the edge, so the row looks finished. A
     horizontal scroller inside a page that scrolls down is missed by a thumb either way. */
  .filters { display: flex; flex-wrap: wrap; gap: .4rem; padding: .6rem 0; }
  /* A folder name too wide for one row has to break INSIDE the chip. The base .chip rule sets
     `white-space: nowrap`, and a flex item does not shrink below its content, so without this a
     single long folder name pushed straight out of the row - and since the wrap fix above removed
     `overflow-x: auto`, that overflow was no longer contained and the WHOLE PAGE gained a sideways
     scrollbar. The old scrolling version was locally bad; losing this made it globally bad.
     Measured: a 69-character folder name took the document to 490px against a 390px viewport.
     This is the same safeguard the step chain on the Workflows screen already uses, which is the
     precedent the wrap fix cites - it was cited without being copied. */
  /* A filter is a button a thumb presses, so it gets the same 44px as every other one on the board;
     the chip it is drawn as was 22px tall. */
  .filters .chip { cursor: pointer; white-space: normal; overflow-wrap: anywhere; min-height: 2.75rem; padding: .3rem .95rem; }
  .filters .chip.on { border-color: var(--accent); color: var(--accent); }
  details.folder { border-bottom: 1px solid var(--line); }
  details.folder:last-child { border-bottom: 0; }
  details.folder > summary { padding: .5rem 1.05rem; min-height: 2.75rem; cursor: pointer; font-weight: 600; font-size: .9rem; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  details.folder > summary::-webkit-details-marker { display: none; }
  .file { display: flex; justify-content: space-between; align-items: center; gap: .5rem; min-height: 2.75rem; padding: .45rem 1.05rem .45rem 1.6rem; font-size: .875rem; border-top: 1px solid var(--line); cursor: pointer; }
  .file:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
  .file:hover { background: var(--panel-2); }
  .file .idx { color: var(--accent); font-size: .6875rem; }

  /* Viewer overlay */
  #viewer { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; flex-direction: column; }
  #viewer.open { display: flex; }
  /* The file viewer takes the top bar's look: the same blurred strip, and Back and GitHub drawn as the
     bar's own 44px buttons. Back was a 33px grey lozenge and GitHub a line of small text, the two
     things anybody does here. The file keeps a reading measure on a wide screen: the side padding
     grows instead of the box shrinking, so the whole window still scrolls it. */
  #viewer .bar {
    display: flex; align-items: center; gap: .6rem; padding: .55rem 1rem;
    padding-top: calc(.55rem + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent);
  }
  #viewer .bar .path { font-size: .8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  #viewer pre {
    flex: 1; overflow: auto; margin: 0; padding: 1.1rem max(1rem, calc((100% - 52rem) / 2)) 2rem;
    font-size: .8125rem; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; color: var(--ink);
  }
  #viewer button, #viewer .bar a {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    min-height: 2.75rem; padding: 0 .9rem; border-radius: 10px;
    font: inherit; font-size: .8125rem; font-weight: 600; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); cursor: pointer;
  }
  #viewer .bar a { color: var(--link); }
  #viewer button:hover, #viewer .bar a:hover { text-decoration: none; border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  #viewer button:focus-visible, #viewer .bar a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

  /* Connections */
  .conn { padding: .95rem 1.05rem; border-bottom: 1px solid var(--line); }
  .conn:last-child { border-bottom: 0; }

  .gap { padding: .8rem 1.05rem; border-bottom: 1px solid var(--line); font-size: .875rem; }
  .gap:last-child { border-bottom: 0; }
  .error { border-color: var(--bad); padding: 1rem 1.1rem; }
  .error h3 { margin-top: 0; color: var(--bad); }
  .problems { margin: .4rem 0 0; padding-left: 1.1rem; color: var(--warn); font-size: .8125rem; }
  footer { margin-top: 2rem; color: var(--muted); font-size: .75rem; }

  /* Top nav on a phone — the screens are the first thing you see, not the last */
  nav {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  /* Seven tabs used to sit in a six-column grid: the seventh wrapped to a second row while
     --nav-h still described one, so a strip of every page lived underneath the nav on every
     phone. Four per row, wrapping to a centred three, and --nav-h counts both rows. */
  nav .tabs { display: flex; flex-wrap: wrap; justify-content: center; max-width: 44rem; margin: 0 auto; }
  nav .tabs > a { flex: 0 0 25%; }
  nav a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem;
    height: var(--nav-row); color: var(--muted); font-size: .6875rem; font-weight: 600;
    letter-spacing: .02em; text-decoration: none;
  }
  nav a:hover { text-decoration: none; }
  nav a.active { color: var(--accent); }

  /* Line icons, drawn here rather than borrowed from a font. The tabs used to carry characters
     like &#9881; and &#9673;, which every phone draws its own way - a gear on one, an emoji on the
     next, an empty box on a third. These take the colour of the words beside them. */
  .ico {
    width: 1.15rem; height: 1.15rem; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  /* What only a wide screen has room for: the board's name and line, the captions over the tabs,
     the counts beside them, the picture, and whose board this is. All of it is hidden here,
     unconditionally, and switched on in the 48rem block further down - which has to stay BELOW
     these rules, because a media query adds no specificity and the later rule wins a tie. On a
     phone the nav is the two rows of tabs and nothing else. */
  .brand, .nav-caption, .count, .side-art, .profile { display: none; }
  .brand { align-items: center; gap: .7rem; padding: 1.3rem 1.25rem .6rem; flex: none; }
  .brand-mark {
    width: 2.25rem; height: 2.25rem; flex: none; padding: .35rem; border-radius: 10px;
    color: var(--accent); background: var(--panel-2); border: 1px solid var(--line);
  }
  .brand-mark svg { display: block; width: 100%; height: 100%; }
  .brand-text { display: flex; flex-direction: column; min-width: 0; }
  .brand-name { font-size: 1.05rem; font-weight: 650; letter-spacing: -.02em; line-height: 1.15; }
  .brand-tag { font-size: .625rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .nav-caption {
    margin: .8rem 0 .3rem; padding: 0 1.55rem;
    font-size: .625rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .count { margin-left: auto; font-size: .75rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* The picture is the harbour from Today, with what the board is doing laid over it. The words
     sit on a wash of --scrim so they read over the bright parts of the picture as well. */
  .side-art {
    position: relative; flex: none; margin: .75rem .9rem; aspect-ratio: 1;
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
  }
  .side-art img {
    display: block; width: 100%; height: 100%; object-fit: cover; object-position: 28% 50%;
    transform: scale(1.35);
  }
  .side-art-caption {
    position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 2.75rem .85rem .75rem;
    font-size: .75rem; line-height: 1.35; color: var(--on-art);
    background: linear-gradient(to top, var(--scrim), transparent);
  }
  .side-art-caption b { display: block; font-size: .875rem; }
  .profile { align-items: center; gap: .65rem; flex: none; padding: .8rem 1.25rem; border-top: 1px solid var(--line); }
  .avatar {
    width: 2.25rem; height: 2.25rem; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: .8125rem; font-weight: 600;
  }
  .who { min-width: 0; font-size: .8125rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* The bar along the top: which screen, whose repo and how fresh the reading is, then the two
     things somebody comes here to do - start a job, or talk to the team - and the theme switch.
     On a phone it is an ordinary row under the fixed tabs and the two buttons are icons; their
     words stay in the page for a screen reader. On a wide screen it sticks to the top. */
  .topbar { display: flex; align-items: center; gap: .35rem .5rem; flex-wrap: wrap; margin-bottom: .15rem; }
  .crumb { display: flex; align-items: baseline; gap: .15rem .6rem; flex-wrap: wrap; flex: 1 1 10rem; min-width: 0; }
  /* A long owner/repo is cut with an ellipsis rather than broken. Breaking it anywhere was tried
     first, and at 768 wide the crumb was squeezed until the repo name stood one letter per line. */
  .crumb > h1 { flex: none; white-space: nowrap; }
  #repo-link { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fresh { display: inline-flex; align-items: center; gap: .4rem; flex: none; font-size: .75rem; color: var(--muted); align-self: center; white-space: nowrap; }
  .fresh-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); box-shadow: 0 0 .5rem var(--ok); }
  .topbar-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem; flex: none;
    min-height: 2.75rem; min-width: 2.75rem; padding: 0 .7rem; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    font-size: .8125rem; font-weight: 600; white-space: nowrap;
  }
  .topbar-btn:hover { text-decoration: none; border-color: var(--accent); }
  .topbar-btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .fresh-text, .btn-label {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  /* Where Run a job lands. On a phone the two rows of tabs are fixed over the top of the page, and
     a heading scrolled to the very top sits underneath them. The extra 1.4rem is the small line
     over the heading, which would otherwise be the part left under the tabs. */
  #run-jobs { scroll-margin-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 2.4rem); }

  /* "Why?" - a link-coloured word with a small chevron that turns when it opens, and the reasoning
     under it in the muted colour. The summary is the full 44px a thumb needs; the negative bottom
     margin gives back the empty half of that height so a closed one does not pad the panel out. */
  details.why { margin: .1rem 0 -.6rem; font-size: .8125rem; }
  .why > summary {
    display: inline-flex; align-items: center; gap: .4rem; min-height: 2.75rem; cursor: pointer;
    list-style: none; color: var(--link); font-weight: 600;
  }
  .why > summary::-webkit-details-marker { display: none; }
  .why > summary::after {
    content: ""; width: .38rem; height: .38rem; margin-top: -.15rem;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg); transition: transform .15s ease;
  }
  details.why[open] > summary::after { transform: rotate(225deg); margin-top: .2rem; }
  .why > summary:hover { text-decoration: underline; }
  .why > summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
  details.why > p { margin: -.3rem 0 .9rem; max-width: 62ch; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .why > summary::after, .agent-card .chev { transition: none; }
  }

  /* Light or dark. A real button with role="switch", so a screen reader says "Light theme, on" and
     a keyboard can reach it. The button is the full 2.75rem a thumb needs; the track and knob are
     drawn smaller inside it, and the knob's side comes from aria-checked - the same attribute the
     screen reader reads, so what is shown and what is announced cannot disagree. */
  .theme-switch {
    position: relative; flex: none; align-self: center;
    width: 3.5rem; min-height: 2.75rem; padding: 0;
    background: none; border: 0; border-radius: 999px; color: inherit; cursor: pointer;
  }
  .theme-switch::before {
    content: ""; position: absolute; left: .25rem; right: .25rem; top: 50%; height: 1.6rem;
    transform: translateY(-50%); border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .theme-switch::after {
    content: ""; position: absolute; left: .5rem; top: 50%; width: 1.1rem; height: 1.1rem;
    transform: translateY(-50%); border-radius: 50%; background: var(--muted);
    transition: transform .2s ease;
  }
  .theme-switch[aria-checked="true"]::after { transform: translate(1.4rem, -50%); background: var(--warn); }
  .theme-switch:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .theme-switch::after { transition: none; }
  }

  /* Desktop: the same nav markup becomes a fixed LEFT sidebar, and the brand, captions, counts
     and profile hidden above come back. Below 48rem none of this exists. Pure CSS. */
  @media (min-width: 48rem) {
    body { padding-top: 0; padding-bottom: 1.5rem; padding-left: var(--sidenav-w); }
    nav {
      top: 0; bottom: 0; right: auto; width: var(--sidenav-w);
      border-bottom: 0; border-right: 1px solid var(--line);
      padding-top: 0; background: var(--bg);
      display: flex; flex-direction: column;
      /* Only ever reached on a window too short for even the tabs and the profile. A clipped
         sidebar hides a tab with no sign it is there; a scrolling one does not. */
      overflow-y: auto;
    }
    /* flex 1 pushes the picture and the profile to the bottom; 0 shrink so a short window
       scrolls the sidebar rather than squeezing the tabs underneath the picture. */
    nav .tabs {
      display: grid; grid-template-columns: 1fr; align-content: start; gap: 2px;
      max-width: none; margin: 0; flex: 1 0 auto; padding: 0 .75rem;
    }
    nav a {
      flex-direction: row; justify-content: flex-start; gap: .7rem;
      height: 2.75rem; padding: 0 .8rem; border-radius: 9px;
      font-size: .875rem; font-weight: 500; letter-spacing: 0;
    }
    nav a:hover { background: var(--panel-2); color: var(--ink); }
    nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .brand { display: flex; }
    .nav-caption { display: block; }
    nav .tabs > .nav-caption { padding: 0 .8rem; }
    .count { display: inline; }
    .profile { display: flex; }

    /* The bar spans the content column edge to edge (the negative margins undo .wrap's padding)
       and stays at the top while the page scrolls under it. */
    .topbar {
      position: sticky; top: 0; z-index: 5; flex-wrap: nowrap;
      margin: -1rem -1.75rem 1rem; padding: .55rem 1.75rem; min-height: 3.75rem;
      background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .crumb { flex-wrap: nowrap; }
    #run-jobs { scroll-margin-top: 5rem; }

    /* The content fills the space beside the sidebar instead of staying at the phone measure.
       Capped so an ultrawide does not stretch the board into something nobody can scan, but the
       cap is high enough that a laptop fills edge to edge: at 1440 the available width is 1200
       and this never bites. */
    .wrap { max-width: 82rem; padding: 1rem 1.75rem 0; }

    /* Layout gets the width; READING does not. A paragraph 1300px wide is measurably harder to
       read than one at 70 characters - the eye loses the line on the way back. So the board, the
       tables and the job lists take the full width, and running text is capped by its own
       measure. Only ever a cap: inside a board column, where the container is already narrower
       than 70ch, these rules do nothing at all. */
    .wrap > p,
    .panel > p,
    .panel.empty,
    .empty,
    p.small,
    .group-note,
    .desc,
    .subs-list,
    .summary { max-width: 70ch; }

  }

  /* The words on the two top-bar buttons and beside the freshness dot, once there is room for them.
     Between 48rem and 64rem the sidebar takes 15rem, and with the words in, the bar squeezed the
     repo name down to one letter per line - seen at 768 wide. Below 64rem they stay icons. */
  @media (min-width: 64rem) {
    .fresh-text, .btn-label { position: static; width: auto; height: auto; overflow: visible; clip-path: none; }
  }

  /* The picture needs height as well as width. On a 1366x640 laptop the brand, nine rows of tabs
     and captions, the picture and the profile do not fit, so the picture - the one part that can
     be spared - waits for a window at least 46rem tall. */
  @media (min-width: 48rem) and (min-height: 46rem) {
    .side-art { display: block; }
  }
  /* A slow drift across the picture, only for someone whose device has not asked for less motion.
     Written as no-preference rather than switched off under reduce, so it cannot run there at all. */
  @keyframes side-art-drift {
    from { transform: scale(1.35) translateX(0); }
    to { transform: scale(1.35) translateX(-9%); }
  }
  @media (min-width: 48rem) and (min-height: 46rem) and (prefers-reduced-motion: no-preference) {
    .side-art img { animation: side-art-drift 30s ease-in-out infinite alternate; }
  }

  /* Agent identity colors — set inline from AGENT_PALETTE. Identity (who owns this) is a
     left border / swatch / chip tint; health (working/quiet/attention) stays on the status
     dot and state label. The two never share an element. */
  .agent-accent { border-left: 3px solid transparent; }
  /* A dot, like the mock-up's legend: the same shape as the state dots, in the agent's own colour. */
  .swatch { width: .5rem; height: .5rem; border-radius: 50%; display: inline-block; flex: none; }

  /* Schedule strip — 7-day week, horizontal scroll on a phone inside its own container */
  .schedule-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(6.5rem, 1fr)); min-width: 45.5rem; }
  .week .day { border-left: 1px solid var(--line); padding: .45rem .45rem .6rem; min-height: 4.5rem; }
  .week .day:first-child { border-left: 0; }
  .week .day .dayname { font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: .3rem; }
  .pill {
    display: block; font-size: .6875rem; line-height: 1.3; border-radius: 8px;
    padding: .25rem .4rem; margin: 0 0 .3rem; background: var(--panel-2);
    border: 1px solid var(--line); border-left-width: 3px;
  }
  .pill .t { color: var(--muted); white-space: nowrap; }
  .sched-foot { border-top: 1px solid var(--line); padding: .6rem 1.05rem; font-size: .8125rem; }
  .sched-foot .pill { display: inline-block; margin: .15rem .35rem .15rem 0; }
  /* Next 7 days — a list, so it reads top to bottom on a phone with no sideways scroll at all */
  .days7 .d7-day { border-top: 1px solid var(--line); padding: .65rem 1.05rem .7rem; }
  .days7 .d7-day:first-child { border-top: 0; }
  .days7 .d7-day.today { background: var(--panel-2); }

  /* The seven days become columns rather than one tall list. Stacked, each day was a row of three
     short words stretched across 1240px and the week ran off the bottom of the screen - width
     made that view worse, not better. Side by side the whole week is one glance, which is the
     question this list exists to answer. Borders switch from top to left to match.

     THIS BLOCK MUST STAY BELOW THE RULES IT OVERRIDES. It first sat with the other desktop rules
     two hundred lines up, and every line of it was dead: a media query adds no specificity, so
     the unconditional `.days7 .d7-day` above - same selector, later in the file - won the tie and
     put a top border back on. Desktop showed every day with BOTH borders and the first day with
     neither. The rule was present, asserted by a test, and never reached a pixel. */
  @media (min-width: 48rem) {
    .days7 { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); }
    .days7 .d7-day { border-top: 0; border-left: 1px solid var(--line); }
    .days7 .d7-day:first-child { border-left: 0; }
    /* The add forms are the only full-width thing on Skills and Team, and on a wide screen the
       phone layout stretched: a 1225px textarea for one sentence, the explanation on one long
       line, and a 1225px submit button. Every test passed and four reads of the stylesheet
       missed it - it was obvious in a screenshot. Running text keeps a readable measure here,
       the same rule the rest of the desktop layout already follows.

       This block sits AFTER the unconditional .fire-form rules on purpose. A media query adds
       no specificity, so an override placed above the rule it overrides is dead code that still
       reads as correct - this repo has shipped that bug once already. */
    .add-panel .fire-form { max-width: 34rem; }
    .add-panel .fire-form .fire { justify-self: start; }
    /* Full width is a thumb target on a phone; across a laptop's content column it is a red bar. */
    #agent-open { width: auto; }
    /* The same measure for Personalise's forms and picture controls, for the same reason: on a
       laptop a banner's controls and Make it yours span the whole content column otherwise. A card's
       drawer is already narrow, so this caps nothing there. */
    .brand-panel .fire-form, .picture-controls { max-width: 34rem; }
    .brand-panel .fire-form .fire, .picture-controls .fire-form .fire { justify-self: start; }
  }
  .d7-date { font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: .35rem; }
  .d7-row {
    display: flex; gap: .55rem; align-items: baseline; text-decoration: none; color: inherit;
    padding: .35rem .5rem; margin: 0 0 .3rem; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line); border-left-width: 3px;
  }
  .days7 .d7-day.today .d7-row { background: var(--panel); }
  .d7-row .d7-t { font-size: .75rem; color: var(--muted); white-space: nowrap; flex: none; min-width: 4.2rem; }
  .d7-row .d7-what { display: flex; flex-wrap: wrap; gap: .3rem .45rem; align-items: baseline; }
  .d7-row .d7-why { flex-basis: 100%; }
  .d7-none { padding: .1rem .45rem; }
  .d7-silent { border-top: 1px solid var(--line); padding: .75rem 1.05rem .8rem; }
  .d7-silent h3 { font-size: .8125rem; margin: 0 0 .2rem; }
  .d7-silent .d7-row { opacity: .75; }
  .d7-silent .d7-row .d7-t { min-width: 7.5rem; }
  /* The nav is fixed and 103px tall, so a card scrolled to viewport top lands BEHIND it: tap a
     job and you arrive at the middle of its card with the name hidden. Measured in the browser
     after clicking, not assumed from the markup - the scroll reported "top: 0" and looked right
     in every number until the screenshot showed the wrong half of the card. */
  .card[id^="job-"] { scroll-margin-top: 7rem; }
  .legend { display: flex; flex-wrap: wrap; gap: .35rem 1rem; padding: .65rem 1.05rem; border-top: 1px solid var(--line); font-size: .75rem; color: var(--muted); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: .4rem; }
  .hero-value { font-size: clamp(2.6rem, 9vw, 4.2rem); font-weight: 700; line-height: 1.05; }
  .hero-unit { font-size: 1rem; opacity: .85; margin-top: .2rem; }

  /* Today's banner: the harbour, with the day, the greeting, the line about the team and the setup
     ring laid over its lower edge. The words sit on a wash of --scrim so they read over the bright
     water as well as the dark hull; the picture and its words are the same in both themes. */
  .banner {
    position: relative; overflow: hidden; display: flex; align-items: flex-end;
    min-height: 13rem; border-radius: 18px; border: 1px solid var(--line);
    background: var(--panel-2); box-shadow: var(--shadow);
  }
  .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; }
  .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 20%, var(--scrim)); }
  .banner-text {
    position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: .9rem 1rem;
    width: 100%; padding: 1.1rem; color: var(--on-art);
  }
  .banner-words { flex: 1 1 18rem; min-width: 0; }
  .banner .eyebrow { color: color-mix(in srgb, var(--on-art) 78%, transparent); }
  /* An h2 for the outline, so a screen reader can jump to it - drawn as the biggest words on the
     board, over the picture, rather than as a section heading. */
  .banner .greeting, .banner .headline {
    margin: .35rem 0 0; font-size: clamp(1.6rem, 5.2vw, 2.6rem); font-weight: 600; line-height: 1.08;
    letter-spacing: -.04em; text-transform: none; color: var(--on-art);
  }
  .greeting .soft, .headline .soft { color: color-mix(in srgb, var(--on-art) 60%, transparent); }
  /* Team's picture is the workshop: its desks sit higher in the frame than the harbour's hull. */
  .team-banner img { object-position: 50% 45%; }
  /* "One desk each." is a phrase. On a phone it moves to its own line whole rather than leaving
     "each." alone under it. */
  .headline .soft { white-space: nowrap; }
  .banner-strap { margin: .45rem 0 0; font-size: .8125rem; color: color-mix(in srgb, var(--on-art) 82%, transparent); }
  .score {
    display: inline-flex; align-items: center; gap: .6rem; padding: .4rem .9rem .4rem .4rem;
    border-radius: 999px; font-size: .75rem; color: var(--on-art);
    background: color-mix(in srgb, var(--scrim) 70%, transparent);
    border: 1px solid color-mix(in srgb, var(--on-art) 16%, transparent); backdrop-filter: blur(8px);
  }
  .ring { width: 1.9rem; height: 1.9rem; flex: none; }
  .ring-track, .ring-done { fill: none; stroke-width: 4; }
  .ring-track { stroke: color-mix(in srgb, var(--on-art) 20%, transparent); }
  .ring-done { stroke: var(--kpi-work); stroke-linecap: round; }

  /* The three number cards. auto-fit, so they stack on a phone, sit side by side when there is
     room, and the sidebar's width needs no query of its own. Each card's colour is one --kpi token,
     tinting the corner, the glow, the dot, the number and the line - and nothing else. */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .75rem; margin: .9rem 0 1rem; }
  .kpi {
    --kpi: var(--kpi-work);
    position: relative; overflow: hidden; margin: 0; padding: 1rem 1.1rem 1.1rem; border-radius: 16px;
    background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--kpi) 18%, transparent), transparent 60%), var(--panel);
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .kpi::before {
    content: ""; position: absolute; width: 10rem; height: 10rem; right: -3rem; top: -3.75rem; border-radius: 50%;
    background: var(--kpi); filter: blur(60px); opacity: .22; pointer-events: none;
  }
  /* Room under the words for the line, only on a card that has one. */
  .kpi:has(> .spark) { padding-bottom: 4.6rem; }
  .kpi-work { --kpi: var(--kpi-work); }
  .kpi-agents { --kpi: var(--kpi-agents); }
  .kpi-ledger { --kpi: var(--kpi-ledger); }
  .kpi > p, .kpi > div { position: relative; }
  .kpi-label {
    display: flex; align-items: center; gap: .5rem; margin: 0;
    font-size: .625rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }
  .kpi-label i { width: .45rem; height: .45rem; border-radius: 50%; background: var(--kpi); box-shadow: 0 0 .5rem var(--kpi); }
  /* The hero's own markup sits in the third card unchanged, so it takes the same size as the other
     two numbers. clamp: "2,131 GBP" has to fit a third of a 1024 screen. */
  .kpi-value, .kpi .hero-value {
    margin: .6rem 0 0; font-size: clamp(2rem, 3.4vw, 3.2rem); font-weight: 700; line-height: 1;
    letter-spacing: -.05em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; color: var(--ink);
  }
  .kpi-value small { font-size: .42em; letter-spacing: -.01em; }
  .kpi .hero-unit { font-size: .8125rem; margin-top: .35rem; }
  .kpi-foot { margin: .4rem 0 0; font-size: .75rem; color: var(--muted); }
  .kpi-source { margin: .1rem 0 0; font-size: .6875rem; color: var(--muted); }
  .kpi-words { margin: .6rem 0 0; font-size: .9375rem; font-weight: 600; }
  .kpi-words .small { font-weight: 400; }
  .kpi-note { margin: .5rem 0 0; font-size: .75rem; color: var(--muted); }
  .spark { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 3.75rem; color: var(--kpi); }
  .spark-line { fill: none; stroke: currentColor; stroke-width: 2.2; vector-effect: non-scaling-stroke; }
  /* The wash under the line is filled from its own gradient, which fades the same colour out. */
  .spark-fill { stroke: none; }

  /* Plan limits: a card per service under the three numbers, side by side when there is room. The
     rings wrap rather than scroll, so three of them never push a phone sideways. A ring's colour
     says how close the plan is to its limit, and only that - the service's own colour is on its
     letter tile, never on the ring. */
  .plan-limits { margin: 0 0 1rem; }
  .plan-limits > .section-head { margin-top: 1.4rem; }
  .plan-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: .75rem; }
  .plan-card { display: grid; gap: .8rem; align-content: start; }
  .card > .plan-head, .card > .meters { margin: 0; }
  .plan-head { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; }
  .tile {
    --tile: var(--kpi-ledger);
    display: grid; place-items: center; flex: none; width: 2.25rem; height: 2.25rem; border-radius: var(--radius-sm);
    font-size: .8125rem; font-weight: 700; letter-spacing: -.02em; color: var(--ink);
    background: color-mix(in srgb, var(--tile) 22%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--tile) 45%, var(--line));
  }
  .tile-claude { --tile: var(--kpi-ledger); }
  .tile-codex { --tile: var(--kpi-agents); }
  .plan-name { flex: 1 1 8rem; min-width: 0; overflow-wrap: anywhere; }
  .plan-name > p { margin: 0; }
  .plan-tier { font-size: .8125rem; color: var(--muted); }
  .plan-chips { display: flex; flex-wrap: wrap; gap: .3rem; }
  /* auto-fill, so three rings fill a phone card edge to edge and a fourth would start a new row. */
  .meters { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); gap: .9rem .5rem; }
  .meter { min-width: 0; text-align: center; }
  .meter > p { margin: 0; }
  .meter-dial { position: relative; width: 4.5rem; height: 4.5rem; margin: 0 auto .35rem; }
  .meter-ring { display: block; width: 100%; height: 100%; }
  .meter-track, .meter-used { fill: none; stroke-width: 4; }
  .meter-track { stroke: var(--chip); }
  .meter-used { stroke-linecap: round; }
  .meter-used.level-ok { stroke: var(--ok); }
  .meter-used.level-warn { stroke: var(--warn); }
  .meter-used.level-bad { stroke: var(--bad); }
  .meter-value {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: .9375rem; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .meter-none { color: var(--muted); font-weight: 400; }
  .meter-label { font-size: .75rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .meter-reset { font-size: .6875rem; line-height: 1.3; color: var(--muted); }
  /* "Fri 7:03 PM" is one thing, and always on its own line under "Resets". Left inline, it sat beside
     "Resets" in a wide column and under it in a narrow one, so two cards read differently. */
  .meter-when { display: block; white-space: nowrap; }
  .card > .plan-missing, .card > .plan-foot, .card > .plan-stale, .card > .plan-estimate { margin: 0; }
  .plan-missing { font-size: .875rem; }
  .plan-foot { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  .plan-stale { font-size: .8125rem; color: var(--warn); overflow-wrap: anywhere; }
  .plan-estimate { font-size: .8125rem; padding-top: .7rem; border-top: 1px solid var(--line); }
  .plan-estimate .chip { margin-right: .3rem; }
  .plan-note { margin: .6rem 0 0; font-size: .75rem; color: var(--muted); }

  /* Subscriptions, in the Usage section: a row per line of stack.yml, the name on the left and what
     it costs a month on the right, wrapping under each other on a phone rather than squeezing. */
  .panel.subs { margin-top: .75rem; }
  .card > .subs-empty, .card > .subs-total, .card > .subs-note { margin: .55rem 0 0; }
  .subs-empty { font-size: .875rem; color: var(--muted); }
  .subs-list { list-style: none; margin: .6rem 0 0; padding: 0; border-bottom: 1px solid var(--line); }
  .subs-row {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: .1rem .75rem;
    padding: .55rem 0; border-top: 1px solid var(--line); font-size: .875rem;
  }
  .subs-name { flex: 1 1 10rem; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .subs-price { font-variant-numeric: tabular-nums; }
  .subs-sub, .subs-mismatch { flex: 1 0 100%; font-size: .75rem; overflow-wrap: anywhere; }
  .subs-sub { color: var(--muted); }
  .subs-mismatch { color: var(--warn); }
  .subs-total { padding-top: .1rem; font-size: .9375rem; }
  .subs-total b { font-variant-numeric: tabular-nums; }
  .subs-note { font-size: .75rem; color: var(--muted); }

  /* Connections: the wall of what each computer found. A card per computer; inside it three folding
     groups, so a phone can close what it has read. Each list is one column on a phone and as many as
     fit on a laptop, and every name breaks inside its row - a server name has no length limit. The
     tiles are neutral on purpose: the state is the word in the chip, and only Failed is amber. */
  .found-wall > .panel.empty { margin-bottom: .2rem; }
  .found-intro { margin: -.35rem 0 .85rem; max-width: 62ch; font-size: .8125rem; color: var(--muted); }
  .found-computer + .found-computer { margin-top: .75rem; }
  .card > .found-head, .card > .found-stale, .card > .found-note { margin: 0; }
  .found-head { min-width: 0; overflow-wrap: anywhere; font-size: .8125rem; color: var(--muted); }
  .found-head > .title { color: var(--ink); }
  .found-age { white-space: nowrap; }
  .card > .found-stale { margin-top: .5rem; }
  .found-stale { font-size: .8125rem; color: var(--warn); overflow-wrap: anywhere; }
  .found-group { margin-top: .7rem; border-top: 1px solid var(--line); }
  .found-group > summary {
    display: flex; flex-wrap: wrap; align-items: center; gap: .1rem .6rem; min-height: 2.75rem;
    padding: .35rem 0; cursor: pointer; list-style: none;
  }
  .found-group > summary::-webkit-details-marker { display: none; }
  .found-group > summary::after {
    content: ""; width: .38rem; height: .38rem; margin: -.15rem .2rem 0 auto;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg); transition: transform .15s ease;
  }
  .found-group[open] > summary::after { transform: rotate(225deg); margin-top: .2rem; }
  .found-group > summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 4px; }
  .found-group-name { font-size: .9375rem; font-weight: 600; color: var(--ink); }
  .found-count { font-size: .75rem; color: var(--muted); }
  .found-live { display: flex; flex-wrap: wrap; gap: .3rem; margin: 0 0 .3rem; }
  .found-sub {
    margin: .7rem 0 .25rem; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .found-list, .found-tools { list-style: none; margin: 0; padding: 0; display: grid; }
  .found-list { grid-template-columns: repeat(auto-fill, minmax(min(100%, 17rem), 1fr)); gap: 0 1.1rem; }
  .found-item { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .6rem; min-width: 0; padding: .4rem 0; }
  .found-tile { --tile: var(--muted); width: 1.9rem; height: 1.9rem; font-size: .75rem; }
  .found-name { display: grid; flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
  .found-title { min-width: 0; font-size: .875rem; font-weight: 600; overflow-wrap: anywhere; }
  .found-meta { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  .found-chips { display: flex; flex-direction: column; align-items: flex-end; gap: .3rem; }
  .found-tools { grid-template-columns: repeat(auto-fill, minmax(min(100%, 12rem), 1fr)); gap: 0 1.1rem; margin-bottom: .5rem; }
  .found-tool {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: .1rem .6rem; min-width: 0;
    padding: .45rem 0; border-bottom: 1px solid var(--line); font-size: .875rem;
  }
  .found-version { font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; }
  .found-version.muted { color: var(--muted); }
  .found-missing { margin: 0 0 .6rem; font-size: .875rem; overflow-wrap: anywhere; }
  .found-note { margin: .45rem 0 .2rem; font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  .card > .found-note { margin-top: .6rem; }
  .found-wall > .found-note { margin: .6rem 0 0; }
  @media (prefers-reduced-motion: reduce) {
    .found-group > summary::after { transition: none; }
  }

  /* Hermes: a card per computer that runs it, at the top of Connections and on its own page. The
     state is the biggest thing on the card, in words; its colour repeats the word. A profile is a
     name over one line of facts that wraps where it must, never sideways. */
  .hermes-cards { display: grid; gap: .75rem; }
  .hermes-card { display: grid; gap: .55rem; align-content: start; }
  .card > .hermes-top, .card > .hermes-foot, .card > .hermes-old, .card > .hermes-note, .card > .hermes-links { margin: 0; }
  .hermes-top { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .7rem; }
  .tile-hermes { --tile: var(--link); }
  .hermes-name { flex: 1 1 9rem; min-width: 0; overflow-wrap: anywhere; }
  .hermes-name > p { margin: 0; }
  .hermes-version { font-size: .8125rem; color: var(--muted); }
  .hermes-top > .hermes-alive { margin: 0; }
  .hermes-alive { font-size: 1.375rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; overflow-wrap: anywhere; }
  .hermes-running { color: var(--ok); }
  .hermes-down { color: var(--warn); }
  .hermes-stale { color: var(--muted); }
  .hermes-old { font-size: .8125rem; color: var(--warn); overflow-wrap: anywhere; }
  .hermes-foot { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  .hermes-profiles { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .hermes-profile {
    display: grid; gap: .1rem; padding: .55rem 0; border-bottom: 1px solid var(--line);
    min-width: 0; overflow-wrap: anywhere; font-size: .8125rem;
  }
  .hermes-profile-name { font-size: .875rem; font-weight: 600; color: var(--ink); }
  .hermes-profile-line { color: var(--ink); }
  .hermes-profile-more { font-size: .75rem; color: var(--muted); }
  .hermes-note { font-size: .75rem; color: var(--muted); overflow-wrap: anywhere; }
  .hermes-links { display: flex; flex-wrap: wrap; gap: 0 1rem; }

  /* Copy cards: folded until opened, the words to paste in a block that wraps rather than scrolls,
     and a Copy button a thumb can hit under each. */
  .copy-cards { display: grid; gap: .75rem; }
  .copy-card > summary {
    display: flex; align-items: center; min-height: 2.75rem; padding: .4rem 1.05rem; cursor: pointer;
    list-style: none; font-weight: 600; font-size: .9375rem;
  }
  .copy-card > summary::-webkit-details-marker { display: none; }
  .copy-card > summary::after {
    content: ""; width: .38rem; height: .38rem; margin: -.15rem 0 0 auto;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
  }
  .copy-card[open] > summary::after { transform: rotate(225deg); margin-top: .2rem; }
  .copy-card > summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: var(--radius); }
  .copy-body { display: grid; gap: .6rem; max-width: 48rem; padding: 0 1.05rem 1rem; }
  .copy-body p { margin: 0; }
  .copy-intro { font-size: .875rem; max-width: 62ch; }
  .copy-variant { display: grid; gap: .4rem; padding-top: .7rem; border-top: 1px solid var(--line); min-width: 0; }
  .copy-os { font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .copy-lead { font-size: .8125rem; overflow-wrap: anywhere; }
  .copy-text {
    margin: 0; padding: .7rem .8rem; border-radius: var(--radius-sm); background: var(--chip); color: var(--ink);
    font-size: .8125rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .copy-btn, .hermes-open {
    justify-self: start; display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 1rem;
    font: inherit; font-size: .875rem; font-weight: 600; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer;
  }
  .hermes-open { color: var(--link); }
  .copy-btn:hover, .hermes-open:hover { text-decoration: none; border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .copy-btn:focus-visible, .hermes-open:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  /* The owner's number on the Ledger is the same card as on Today, on its own. Capped, because one
     card stretched across a laptop is a band of colour with a number lost at its left end. */
  .kpis-one { max-width: 26rem; }

  /* Ledger: the week's hours as the first thing on the panel, at a size between a line of text and
     a number card. The approve block is the decision under a proposal, ruled off from the three
     citations above it. */
  .week-line { font-size: .9375rem; }
  .week-line > b:first-child { font-size: 1.6rem; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .approve { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--line); }
  .approve .fire-note { margin-left: .5rem; }

  /* The number fades from the ink into the card's colour, where the browser can paint text with a
     background; anywhere it cannot, the plain ink above stands. */
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .kpi-value, .kpi .hero-value {
      background: linear-gradient(180deg, var(--ink), color-mix(in srgb, var(--kpi) 70%, var(--ink)));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
  }

  /* More room for the banner on a wide screen. Below the rules it overrides, as every override in
     this sheet has to be. */
  @media (min-width: 48rem) {
    .banner { min-height: 15rem; border-radius: 22px; }
    .banner-text { padding: 1.6rem 1.9rem; }
    /* Beside the setup pill a laptop has about 830px for the greeting; at 2.6rem the last word of
       "Here is where things stand." fell onto a line of its own. */
    .banner .greeting, .banner .headline { font-size: clamp(1.6rem, 2.5vw, 2.25rem); }
    .kpis { gap: 1rem; margin: 1.1rem 0 1.25rem; }
  }
  /* Talk to the board: the orb, bottom-right on every screen, and the sheet above it. The dock is the
     width of the screen less a gutter each side, so the sheet can be too on a phone; it lets taps
     through to the page everywhere but on the orb and the sheet themselves. Above the phone's home
     bar, and clear of the nav, which is at the top. */
  .voice-dock {
    position: fixed; left: 1rem; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 15;
    display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; pointer-events: none;
  }
  .voice-dock > * { pointer-events: auto; }
  /* Room at the end of the page, so the orb never sits over the last thing on it - and, while the
     sheet is open, room for the sheet as well (its tallest, the orb under it and the home bar), so
     the Voice spend card and the footer can still be scrolled clear of it during a call. */
  .voice-on .wrap { padding-bottom: 5.5rem; }
  .voice-open .wrap { padding-bottom: calc(min(60vh, 28rem) + 6rem + env(safe-area-inset-bottom, 0px)); }
  .voice-orb {
    width: 3.5rem; height: 3.5rem; min-width: 2.75rem; min-height: 2.75rem; padding: 0; flex: none;
    display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--accent); background: var(--panel); color: var(--accent); box-shadow: var(--shadow);
  }
  .voice-orb .ico { width: 1.5rem; height: 1.5rem; }
  .voice-orb:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
  /* Each state has a shape of its own as well as its words, so colour is never the only sign: a
     broken ring while it connects or thinks, a still ring while it listens, filled while it speaks. */
  .voice-orb[data-state="connecting"], .voice-orb[data-state="thinking"] { border-style: dashed; }
  .voice-orb[data-state="listening"] { box-shadow: 0 0 0 .3rem color-mix(in srgb, var(--accent) 35%, transparent); }
  .voice-orb[data-state="speaking"] { background: var(--accent); color: var(--panel); }
  .voice-orb[data-state="error"] { border-color: var(--warn); color: var(--warn); }
  .voice-orb[aria-disabled="true"] { border-color: var(--line); color: var(--muted); cursor: default; }
  /* The ring breathes while it listens, only for someone whose device has not asked for less motion:
     written as no-preference, like the sidebar's picture, so it cannot run anywhere else. */

    0%, 100% { box-shadow: 0 0 0 .3rem color-mix(in srgb, var(--accent) 35%, transparent); }
    50% { box-shadow: 0 0 0 .7rem color-mix(in srgb, var(--accent) 10%, transparent); }
  }

  }
  .voice-sheet {

  }

  .voice-who { display: block; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .voice-said { display: block; overflow-wrap: anywhere; }

  .voice-toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  /* Voice spend, in Today's Usage section under Subscriptions. "estimate" is a chip in plain view. */

  .voice-spend .title { margin: 0 0 .4rem; }

  /* From 1024px the sheet is docked beside the orb at a reading width. */
  @media (min-width: 64rem) {
    .voice-sheet { width: 22rem; }
  }
