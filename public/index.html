<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f13" />
<title>Agent OS</title>
<!-- The course tells every attendee to bookmark this on their phone before they leave the
     room. Without these it lands as a blank tile. Rebuild: node scripts/build-icons.mjs -->
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="Agent OS" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f13;
    --panel: #151920;
    --panel-2: #1a1f28;
    --ink: #e8eaee;
    --muted: #8b93a1;
    --line: #262b35;
    --accent: #6ea8ff;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --chip: #202632;
    --radius: 12px;
    --nav-row: 3.2rem;
    --nav-h: calc(var(--nav-row) * 2); /* the phone nav is two rows; see nav .tabs */
    --sidenav-w: 11rem;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 1rem);
  }
  /* 44rem is a phone-and-tablet measure, and on a phone it is the right one. The desktop
     override is below, in the same media query that turns the nav into a sidebar - this cap was
     written when the page was phone-only, the sidebar was added later, and nothing ever lifted
     it. On a 1890px screen that left 176px of sidebar, 498px of nothing, 704px of content and
     513px more nothing: over half the window empty, with the task board squeezed into four
     168px columns. */
  .wrap { max-width: 44rem; margin: 0 auto; padding: 1rem 1rem 0; }
  header { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .15rem; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: .8rem; margin: 1.4rem 0 .5rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: .8125rem; margin: 0 0 .75rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .card { padding: .8rem .9rem; }
  .stack > .panel { margin-bottom: .6rem; }
  .row { display: flex; flex-wrap: wrap; gap: .35rem .5rem; align-items: center; }
  .between { justify-content: space-between; }
  .chip {
    font-size: .6875rem; letter-spacing: .04em; text-transform: uppercase;
    background: var(--chip); border-radius: 999px; padding: .18rem .55rem; white-space: nowrap;
    color: var(--muted);
  }
  .chip.on { color: var(--ink); }
  .chip.ok { color: var(--ok); }
  .chip.warn { color: var(--warn); }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
  .working .dot, .live .dot { background: var(--ok); }
  .quiet .dot, .attention .dot, .silent .dot { background: var(--warn); }
  .never-run .dot, .no-heartbeat .dot { background: var(--bad); }
  /* Not in use is a decision, not a fault - so it reads muted rather than red. */
  .not-in-use .dot { background: var(--muted); }
  .state { font-size: .75rem; font-weight: 600; color: var(--muted); }
  .working .state, .live .state { color: var(--ok); }
  .quiet .state, .attention .state, .silent .state { color: var(--warn); }
  .never-run .state, .no-heartbeat .state { color: var(--bad); }
  .not-in-use .state { color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: .8125rem; }
  /* There was no `.bad` rule at all. Five places in this page write `class="small bad"` for their
     worst sentence and every one of them rendered as ordinary body text, including the most serious
     sentence on the board - "A routine is firing for this and the file says it is off. It is
     spending runs nobody approved." Somebody's money, in the same grey as everything else.
     `.fire-note.bad` and `.never-run .state` both already point at this variable, so the intent was
     written down four times and the one rule that would carry it was missing. */
  .bad { color: var(--bad); }
  /* Somebody else's sentence, at whatever length they wrote it. Three lines on a phone is enough to
     read the reason; the whole thing is in the title attribute. overflow-wrap because a long word
     or a pasted address would otherwise push the card wider than the screen. */
  .clamp {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .empty { padding: 1rem; color: var(--muted); font-size: .875rem; }
  code { background: var(--chip); padding: .1rem .3rem; border-radius: 4px; font-size: .85em; }
  .title { font-size: .975rem; font-weight: 600; margin: 0; }
  /* The chain wraps rather than scrolling sideways. It used to be `nowrap; overflow-x: auto`, so
     at phone width a three-step chain was cut off mid-word - "review-dr" just stopped - with no
     ellipsis, no fade, nothing saying it could be swiped. It read as a rendering fault, and a
     sideways scroller inside a page that scrolls down is missed by a thumb anyway. This is the one
     screen whose whole job is saying what each job does, so the last step - usually the one that
     identifies it - is not something to hide. Wrapping costs a variable card height and nothing
     else. */
  .steps { color: var(--muted); font-size: .8125rem; margin: .3rem 0 .1rem; overflow-wrap: anywhere; }
  .steps b { color: var(--ink); font-weight: 500; }

  /* Screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Setup ladder */
  /* auto-fit, never a fixed count: this was repeat(5, 1fr) while the course taught six
     stages, so Improvement had nowhere to render. Same bug as seven nav tabs in six columns. */
  .ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.25rem, 1fr)); gap: .35rem .5rem; padding: .7rem .8rem .8rem; }
  .rung { text-align: center; font-size: .6875rem; color: var(--muted); }
  .rung .bar { height: .3rem; border-radius: 999px; background: var(--chip); margin-bottom: .35rem; }
  .rung.pass .bar { background: var(--ok); }
  .rung.pass { color: var(--ink); }

  /* Fire buttons */
  .fires { display: flex; flex-wrap: wrap; gap: .5rem; }
  button.fire {
    font: inherit; font-size: .875rem; font-weight: 600;
    color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .7rem 1rem; min-height: 2.9rem;
    display: inline-flex; align-items: center; gap: .5rem;
  }
  button.fire[disabled] { opacity: .55; }
  button.fire:not([disabled]) { cursor: pointer; }
  button.fire:not([disabled]):hover { border-color: var(--accent); }
  .soon { font-size: .625rem; letter-spacing: .05em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: .05rem .4rem; }
  .fire-note { font-size: .8125rem; }
  .fire-note.ok { color: var(--ok); }
  .fire-note.bad { color: var(--bad); }

  /* Unlock — the whole page when the view key is missing or wrong. Phone-first: one
     field, one thumb-sized button, nothing else to read. */
  .unlock { max-width: 22rem; margin: 18vh auto; padding: 0 1.2rem; text-align: left; }
  .unlock h1 { font-size: 1.4rem; margin: 0 0 .4rem; }
  .unlock p { color: var(--muted); font-size: .875rem; }
  #unlock-form { display: flex; gap: .5rem; margin: 1rem 0 .8rem; }
  #unlock-key {
    flex: 1; min-width: 0; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: .6rem .7rem;
  }

  /* Add-task — an inline form at the top of the To do column. Phone-first: full-width
     fields, one thumb-sized submit button, no dialog. */
  .add-task { padding: .6rem .9rem .7rem; border-bottom: 1px solid var(--line); }
  .add-task .fire + .fire { margin-left: .4rem; }
  /* One class for every inline form on the board, rather than a block of rules per form id.
     There were two near-identical id blocks here - #task-form and #wf-form - and when Add skill
     and Add agent arrived they matched neither: the textarea rendered as a bare browser default
     on a dark page, on the phone and the desktop alike. Nothing caught it, because the render
     harness pulls out the page's inline script and never reads this stylesheet, so no test in
     this repo could see a CSS rule at all. Both halves are fixed: the rules are a class now, and
     a test walks every form the page emits and refuses one the stylesheet does not cover.
     (Naming a script or style tag literally in here would break that harness - its regex would
     start matching at the mention. That is why this comment describes them in words.) */
  .fire-form { display: grid; gap: .5rem; margin-top: .6rem; }
  .fire-form[hidden] { display: none; }
  .fire-form label { font-size: .75rem; font-weight: 600; color: var(--muted); }
  .fire-form textarea, .fire-form select {
    width: 100%; font: inherit; font-size: .875rem; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: .55rem .65rem;
  }
  .fire-form textarea { resize: vertical; min-height: 4.4rem; }
  .fire-form .row { flex-wrap: nowrap; }
  .fire-form select { flex: 1; min-width: 0; }
  /* On Today this block is one part of a board column and its bottom border separates it from the
     cards below. On Skills and Team it is the only child of a panel of its own, so that border
     lands directly on the panel's own bottom border - two hairlines, one gap apart - and .panel
     carries no margin, so the next panel starts flush against it and the two read as one fused
     card. Both are only visible on the two new screens, which is why they are fixed here and not
     on .panel or .add-task, where they would change Today. */
  .add-panel { margin-bottom: .6rem; }
  .add-panel .add-task { border-bottom: 0; }

  /* Week calendar - the Schedule strip with dates and outcomes. A pill is done when a run
     for that workflow landed that day, missed when the day has passed without one. */
  .day.today .dayname { color: var(--ink); font-weight: 700; }
  .daydate { font-size: .68rem; color: var(--muted); font-weight: 400; }
  .pill .mark { font-size: .72rem; margin-left: .3rem; }
  .pill.done .mark { color: var(--ok, #3fb950); }
  .pill.missed { opacity: .55; }
  .pill.missed .mark { color: var(--bad, #d29922); }
  .cal-key { display: flex; gap: .9rem; flex-wrap: wrap; margin-top: .5rem; font-size: .72rem; color: var(--muted); }

  /* Board — four columns stack on a phone (one-handed rule), pair up on medium screens,
     and sit side by side only when there is genuinely room for four. */
  .board { display: grid; grid-template-columns: 1fr; gap: .6rem; }
  @media (min-width: 48rem) { .board { grid-template-columns: repeat(2, 1fr); align-items: start; } }
  @media (min-width: 64rem) { .board { grid-template-columns: repeat(4, 1fr); } }
  .board .col-title { display: flex; justify-content: space-between; align-items: baseline; padding: .55rem .9rem; border-bottom: 1px solid var(--line); font-size: .6875rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .board .kcard { padding: .6rem .9rem; border-bottom: 1px solid var(--line); font-size: .875rem; }
  .board .kcard:last-child { border-bottom: 0; }
  .board .kcard .summary { margin: .15rem 0 0; font-size: .8125rem; color: var(--muted); }
  /* Start / Done on a task card, and what the card says while the change is in flight. */
  .board .kcard .row.between + .row.between { margin-top: .4rem; }
  .small-fire { font-size: .75rem; padding: .3rem .55rem; min-height: 2.25rem; }
  .move-note { margin-top: .4rem; }
  .move-note.ok { color: var(--ok); }
  .move-note.bad { color: var(--bad); }
  /* Dimmed, not moved: the card is still whatever the repo says until the commit lands. */
  .board .kcard.pending { opacity: .6; }
  .board .kcard.done-task .summary { font-style: italic; }
  .finished-tasks { border-top: 1px solid var(--line); }
  .finished-tasks > summary { padding: .55rem .9rem; cursor: pointer; color: var(--muted); }
  .finished-tasks[open] > summary { border-bottom: 1px solid var(--line); }
  .st { font-weight: 700; }
  .st-ok { color: var(--ok); }
  .st-partial, .st-blocked { color: var(--warn); }
  .st-failed { color: var(--bad); }

  /* Run list */
  .run { padding: .7rem .9rem; border-bottom: 1px solid var(--line); }
  .run:last-child { border-bottom: 0; }
  .run .summary { margin: .2rem 0 0; font-size: .875rem; color: var(--muted); }

  /* Measured in Chromium at 375x667: every other control on the board cleared 32px and this one
     was 34x17. It is also the only control that goes from a phone to the live transcript of a
     run, which makes it the worst one to have to aim at. */
  a.watch {
    display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 .5rem;
    margin: -.6rem 0; font-weight: 600;
  }

  /* Same measurement, same fix: a skill's name is the link that opens the file, and it was 23px
     tall. Anything on this page that is meant to be tapped gets the thumb target. */
  a.title[data-open] { display: inline-flex; align-items: center; min-height: 2.75rem; }

  h3.group { margin: 1.1rem 0 .1rem; font-size: .95rem; }
  .group-note { margin: 0 0 .45rem; }

  /* Team */
  .agent { padding: .85rem .9rem; border-bottom: 1px solid var(--line); }
  .agent:last-child { border-bottom: 0; }
  .agent p.desc { margin: .3rem 0 .45rem; color: var(--muted); font-size: .8125rem; }
  details.agent > summary { list-style: none; cursor: pointer; }
  details.agent > summary::-webkit-details-marker { display: none; }
  /* The card opens to show what this agent actually did. The marker above is hidden, and a
     `cursor: pointer` is invisible on the phone this board is built to be read on - so on the
     device that matters there was nothing at all saying a tap did anything. This is that sign. */
  .agent .runcount { display: block; margin-top: .35rem; color: var(--muted); font-size: .75rem; }
  .agent .chev { display: inline-block; margin-left: .35rem; transition: transform .15s ease; }
  details.agent[open] .chev { transform: rotate(90deg); }
  .agent-runs { margin-top: .6rem; border-top: 1px solid var(--line); }

  /* Memory */
  input[type=search] {
    width: 100%; font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); padding: .65rem .8rem;
  }
  /* Wraps rather than scrolling sideways. At 390px this row is 804px of chips in 358px, so SEVEN
     of the twelve filters sat off-screen - including `shared`, which holds the business brain and
     18 of this repo's 59 pages. Worse than the step chain on the Workflows screen, which at least
     stopped mid-word: a chip boundary happens to land near the edge, so the row looks finished. A
     horizontal scroller inside a page that scrolls down is missed by a thumb either way. */
  .filters { display: flex; flex-wrap: wrap; gap: .4rem; padding: .6rem 0; }
  /* A folder name too wide for one row has to break INSIDE the chip. The base .chip rule sets
     `white-space: nowrap`, and a flex item does not shrink below its content, so without this a
     single long folder name pushed straight out of the row - and since the wrap fix above removed
     `overflow-x: auto`, that overflow was no longer contained and the WHOLE PAGE gained a sideways
     scrollbar. The old scrolling version was locally bad; losing this made it globally bad.
     Measured: a 69-character folder name took the document to 490px against a 390px viewport.
     This is the same safeguard the step chain on the Workflows screen already uses, which is the
     precedent the wrap fix cites - it was cited without being copied. */
  .filters .chip { cursor: pointer; border: 1px solid transparent; white-space: normal; overflow-wrap: anywhere; }
  .filters .chip.on { border-color: var(--accent); color: var(--accent); }
  details.folder { border-bottom: 1px solid var(--line); }
  details.folder:last-child { border-bottom: 0; }
  details.folder > summary { padding: .65rem .9rem; cursor: pointer; font-weight: 600; font-size: .9rem; list-style: none; display: flex; justify-content: space-between; gap: .5rem; }
  details.folder > summary::-webkit-details-marker { display: none; }
  .file { display: flex; justify-content: space-between; gap: .5rem; padding: .5rem .9rem .5rem 1.5rem; font-size: .875rem; border-top: 1px solid var(--line); cursor: pointer; }
  .file:hover { background: var(--panel-2); }
  .file .idx { color: var(--accent); font-size: .6875rem; }

  /* Viewer overlay */
  #viewer { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; flex-direction: column; }
  #viewer.open { display: flex; }
  #viewer .bar { display: flex; align-items: center; gap: .75rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  #viewer .bar .path { font-size: .8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #viewer pre { flex: 1; overflow: auto; margin: 0; padding: 1rem; font-size: .8125rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  #viewer button { font: inherit; color: var(--ink); background: var(--chip); border: 0; border-radius: 8px; padding: .4rem .8rem; }

  /* Connections */
  .conn { padding: .85rem .9rem; border-bottom: 1px solid var(--line); }
  .conn:last-child { border-bottom: 0; }

  .gap { padding: .7rem .9rem; border-bottom: 1px solid var(--line); font-size: .875rem; }
  .gap:last-child { border-bottom: 0; }
  .error { border-color: var(--bad); padding: 1rem 1.1rem; }
  .error h3 { margin-top: 0; color: var(--bad); }
  .problems { margin: .4rem 0 0; padding-left: 1.1rem; color: var(--warn); font-size: .8125rem; }
  footer { margin-top: 2rem; color: var(--muted); font-size: .75rem; }

  /* Top nav on a phone — the screens are the first thing you see, not the last */
  nav {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    background: rgba(13, 15, 19, .92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  /* Seven tabs used to sit in a six-column grid: the seventh wrapped to a second row while
     --nav-h still described one, so a strip of every page lived underneath the nav on every
     phone. Four per row, wrapping to a centred three, and --nav-h counts both rows. */
  nav .tabs { display: flex; flex-wrap: wrap; justify-content: center; max-width: 44rem; margin: 0 auto; }
  nav .tabs > a { flex: 0 0 25%; }
  nav a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
    height: var(--nav-row); color: var(--muted); font-size: .6875rem; font-weight: 600;
    letter-spacing: .02em; text-decoration: none;
  }
  nav a:hover { text-decoration: none; }
  nav a .glyph { font-size: 1.05rem; line-height: 1; font-weight: 400; }
  nav a.active { color: var(--accent); }

  /* "Talk to your team" — a plain link out to claude.ai/code, no API call behind it.
     In the header on every size; the sidebar copy only exists on desktop. */
  .talk-header { margin-left: auto; font-size: .8125rem; white-space: nowrap; }
  nav .talk { display: none; }

  /* Desktop: the same nav markup becomes a fixed LEFT sidebar; below 48rem nothing changes
     and the top bar stays exactly as it is. Pure CSS, no script involved. */
  @media (min-width: 48rem) {
    body { padding-top: 0; padding-bottom: 1.5rem; padding-left: var(--sidenav-w); }
    nav {
      top: 0; bottom: 0; right: auto; width: var(--sidenav-w);
      border-bottom: 0; border-right: 1px solid var(--line);
      padding-top: 0;
      display: flex; flex-direction: column;
    }
    nav .tabs {
      display: grid; grid-template-columns: 1fr; align-content: start;
      max-width: none; margin: 0; flex: 1; min-height: 0; padding-top: 1rem;
    }
    nav a {
      flex-direction: row; justify-content: flex-start; gap: .65rem;
      height: 3rem; padding: 0 1.1rem; font-size: .8125rem;
    }
    nav .talk {
      display: flex; flex: none; height: 3rem;
      border-top: 1px solid var(--line);
      color: var(--muted); font-weight: 600;
    }
    nav .talk:hover { color: var(--accent); }

    /* The content fills the space beside the sidebar instead of staying at the phone measure.
       Capped so an ultrawide does not stretch the board into something nobody can scan, but the
       cap is high enough that a laptop fills edge to edge: at 1440 the available width is 1264
       and this never bites. */
    .wrap { max-width: 82rem; padding: 1rem 1.75rem 0; }

    /* Layout gets the width; READING does not. A paragraph 1300px wide is measurably harder to
       read than one at 70 characters - the eye loses the line on the way back. So the board, the
       tables and the job lists take the full width, and running text is capped by its own
       measure. Only ever a cap: inside a board column, where the container is already narrower
       than 70ch, these rules do nothing at all. */
    .wrap > p,
    .panel > p,
    .panel.empty,
    .empty,
    p.small,
    .group-note,
    .desc,
    .summary { max-width: 70ch; }

  }

  /* Agent identity colors — set inline from AGENT_PALETTE. Identity (who owns this) is a
     left border / swatch / chip tint; health (working/quiet/attention) stays on the status
     dot and state label. The two never share an element. */
  .agent-accent { border-left: 3px solid transparent; }
  .swatch { width: .6rem; height: .6rem; border-radius: 3px; display: inline-block; flex: none; }

  /* Schedule strip — 7-day week, horizontal scroll on a phone inside its own container */
  .schedule-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(6.5rem, 1fr)); min-width: 45.5rem; }
  .week .day { border-left: 1px solid var(--line); padding: .45rem .45rem .6rem; min-height: 4.5rem; }
  .week .day:first-child { border-left: 0; }
  .week .day .dayname { font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: .3rem; }
  .pill {
    display: block; font-size: .6875rem; line-height: 1.3; border-radius: 6px;
    padding: .25rem .4rem; margin: 0 0 .3rem; background: var(--panel-2);
    border: 1px solid var(--line); border-left-width: 3px;
  }
  .pill .t { color: var(--muted); white-space: nowrap; }
  .sched-foot { border-top: 1px solid var(--line); padding: .5rem .9rem; font-size: .8125rem; }
  .sched-foot .pill { display: inline-block; margin: .15rem .35rem .15rem 0; }
  /* Next 7 days — a list, so it reads top to bottom on a phone with no sideways scroll at all */
  .days7 .d7-day { border-top: 1px solid var(--line); padding: .5rem .9rem .6rem; }
  .days7 .d7-day:first-child { border-top: 0; }
  .days7 .d7-day.today { background: var(--panel-2); }

  /* The seven days become columns rather than one tall list. Stacked, each day was a row of three
     short words stretched across 1240px and the week ran off the bottom of the screen - width
     made that view worse, not better. Side by side the whole week is one glance, which is the
     question this list exists to answer. Borders switch from top to left to match.

     THIS BLOCK MUST STAY BELOW THE RULES IT OVERRIDES. It first sat with the other desktop rules
     two hundred lines up, and every line of it was dead: a media query adds no specificity, so
     the unconditional `.days7 .d7-day` above - same selector, later in the file - won the tie and
     put a top border back on. Desktop showed every day with BOTH borders and the first day with
     neither. The rule was present, asserted by a test, and never reached a pixel. */
  @media (min-width: 48rem) {
    .days7 { display: grid; grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr)); }
    .days7 .d7-day { border-top: 0; border-left: 1px solid var(--line); }
    .days7 .d7-day:first-child { border-left: 0; }
    /* The add forms are the only full-width thing on Skills and Team, and on a wide screen the
       phone layout stretched: a 1225px textarea for one sentence, the explanation on one long
       line, and a 1225px submit button. Every test passed and four reads of the stylesheet
       missed it - it was obvious in a screenshot. Running text keeps a readable measure here,
       the same rule the rest of the desktop layout already follows.

       This block sits AFTER the unconditional .fire-form rules on purpose. A media query adds
       no specificity, so an override placed above the rule it overrides is dead code that still
       reads as correct - this repo has shipped that bug once already. */
    .add-panel .fire-form { max-width: 34rem; }
    .add-panel .fire-form .fire { justify-self: start; }
  }
  .d7-date { font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: .35rem; }
  .d7-row {
    display: flex; gap: .55rem; align-items: baseline; text-decoration: none; color: inherit;
    padding: .3rem .45rem; margin: 0 0 .25rem; border-radius: 6px;
    background: var(--panel-2); border: 1px solid var(--line); border-left-width: 3px;
  }
  .days7 .d7-day.today .d7-row { background: var(--panel); }
  .d7-row .d7-t { font-size: .75rem; color: var(--muted); white-space: nowrap; flex: none; min-width: 4.2rem; }
  .d7-row .d7-what { display: flex; flex-wrap: wrap; gap: .3rem .45rem; align-items: baseline; }
  .d7-row .d7-why { flex-basis: 100%; }
  .d7-none { padding: .1rem .45rem; }
  .d7-silent { border-top: 1px solid var(--line); padding: .6rem .9rem .7rem; }
  .d7-silent h3 { font-size: .8125rem; margin: 0 0 .2rem; }
  .d7-silent .d7-row { opacity: .75; }
  .d7-silent .d7-row .d7-t { min-width: 7.5rem; }
  /* The nav is fixed and 103px tall, so a card scrolled to viewport top lands BEHIND it: tap a
     job and you arrive at the middle of its card with the name hidden. Measured in the browser
     after clicking, not assumed from the markup - the scroll reported "top: 0" and looked right
     in every number until the screenshot showed the wrong half of the card. */
  .card[id^="job-"] { scroll-margin-top: 7rem; }
  .legend { display: flex; flex-wrap: wrap; gap: .35rem .9rem; padding: .55rem .9rem; border-top: 1px solid var(--line); font-size: .75rem; color: var(--muted); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .hero { text-align: center; padding: 1.6rem 1rem; }
  .hero-value { font-size: clamp(2.6rem, 9vw, 4.2rem); font-weight: 700; line-height: 1.05; }
  .hero-unit { font-size: 1rem; opacity: .85; margin-top: .2rem; }
</style>
</head>
<body>

     title="Open a Claude session on your team repo - your orchestrator, your rules"><span class="glyph">&#9998;</span>Talk to your team</a>
