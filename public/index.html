<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0f13" />
<title>Agent OS</title>
<!-- The course tells every attendee to bookmark this on their phone before they leave the
     room. Without these it lands as a blank tile. Rebuild: node scripts/build-icons.mjs -->
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="Agent OS" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f13;
    --panel: #151920;
    --panel-2: #1a1f28;
    --ink: #e8eaee;
    --muted: #8b93a1;
    --line: #262b35;
    --accent: #6ea8ff;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --chip: #202632;
    --radius: 12px;
    --nav-row: 3.2rem;
    --nav-h: calc(var(--nav-row) * 2); /* the phone nav is two rows; see nav .tabs */
    --sidenav-w: 11rem;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 1rem);
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 1rem 1rem 0; }
  header { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .15rem; }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: .8rem; margin: 1.4rem 0 .5rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: .8125rem; margin: 0 0 .75rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .card { padding: .8rem .9rem; }
  .stack > .panel { margin-bottom: .6rem; }
  .row { display: flex; flex-wrap: wrap; gap: .35rem .5rem; align-items: center; }
  .between { justify-content: space-between; }
  .chip {
    font-size: .6875rem; letter-spacing: .04em; text-transform: uppercase;
    background: var(--chip); border-radius: 999px; padding: .18rem .55rem; white-space: nowrap;
    color: var(--muted);
  }
  .chip.on { color: var(--ink); }
  .chip.ok { color: var(--ok); }
  .chip.warn { color: var(--warn); }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
  .working .dot, .live .dot { background: var(--ok); }
  .quiet .dot, .attention .dot, .silent .dot { background: var(--warn); }
  .never-run .dot, .no-heartbeat .dot { background: var(--bad); }
  /* Not in use is a decision, not a fault - so it reads muted rather than red. */
  .not-in-use .dot { background: var(--muted); }
  .state { font-size: .75rem; font-weight: 600; color: var(--muted); }
  .working .state, .live .state { color: var(--ok); }
  .quiet .state, .attention .state, .silent .state { color: var(--warn); }
  .never-run .state, .no-heartbeat .state { color: var(--bad); }
  .not-in-use .state { color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: .8125rem; }
  .empty { padding: 1rem; color: var(--muted); font-size: .875rem; }
  code { background: var(--chip); padding: .1rem .3rem; border-radius: 4px; font-size: .85em; }
  .title { font-size: .975rem; font-weight: 600; margin: 0; }
  /* The chain wraps rather than scrolling sideways. It used to be `nowrap; overflow-x: auto`, so
     at phone width a three-step chain was cut off mid-word - "review-dr" just stopped - with no
     ellipsis, no fade, nothing saying it could be swiped. It read as a rendering fault, and a
     sideways scroller inside a page that scrolls down is missed by a thumb anyway. This is the one
     screen whose whole job is saying what each job does, so the last step - usually the one that
     identifies it - is not something to hide. Wrapping costs a variable card height and nothing
     else. */
  .steps { color: var(--muted); font-size: .8125rem; margin: .3rem 0 .1rem; overflow-wrap: anywhere; }
  .steps b { color: var(--ink); font-weight: 500; }

  /* Screens */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Setup ladder */
  /* auto-fit, never a fixed count: this was repeat(5, 1fr) while the course taught six
     stages, so Improvement had nowhere to render. Same bug as seven nav tabs in six columns. */
  .ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.25rem, 1fr)); gap: .35rem .5rem; padding: .7rem .8rem .8rem; }
  .rung { text-align: center; font-size: .6875rem; color: var(--muted); }
  .rung .bar { height: .3rem; border-radius: 999px; background: var(--chip); margin-bottom: .35rem; }
  .rung.pass .bar { background: var(--ok); }
  .rung.pass { color: var(--ink); }

  /* Fire buttons */
  .fires { display: flex; flex-wrap: wrap; gap: .5rem; }
  button.fire {
    font: inherit; font-size: .875rem; font-weight: 600;
    color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: var(--radius); padding: .7rem 1rem; min-height: 2.9rem;
    display: inline-flex; align-items: center; gap: .5rem;
  }
  button.fire[disabled] { opacity: .55; }
  button.fire:not([disabled]) { cursor: pointer; }
  button.fire:not([disabled]):hover { border-color: var(--accent); }
  .soon { font-size: .625rem; letter-spacing: .05em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: .05rem .4rem; }
  .fire-note { font-size: .8125rem; }
  .fire-note.ok { color: var(--ok); }
  .fire-note.bad { color: var(--bad); }

  /* Unlock — the whole page when the view key is missing or wrong. Phone-first: one
     field, one thumb-sized button, nothing else to read. */
  .unlock { max-width: 22rem; margin: 18vh auto; padding: 0 1.2rem; text-align: left; }
  .unlock h1 { font-size: 1.4rem; margin: 0 0 .4rem; }
  .unlock p { color: var(--muted); font-size: .875rem; }
  #unlock-form { display: flex; gap: .5rem; margin: 1rem 0 .8rem; }
  #unlock-key {
    flex: 1; min-width: 0; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: .6rem .7rem;
  }

  /* Add-task — an inline form at the top of the To do column. Phone-first: full-width
     fields, one thumb-sized submit button, no dialog. */
  .add-task { padding: .6rem .9rem .7rem; border-bottom: 1px solid var(--line); }
  #task-form { display: grid; gap: .5rem; margin-top: .6rem; }
  #task-form[hidden] { display: none; }
  #task-form label { font-size: .75rem; font-weight: 600; color: var(--muted); }
  #task-form textarea, #task-form select {
    width: 100%; font: inherit; font-size: .875rem; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: .55rem .65rem;
  }
  #task-form textarea { resize: vertical; min-height: 4.4rem; }
  #task-form .row { flex-wrap: nowrap; }
  #task-form select { flex: 1; min-width: 0; }
  .add-task .fire + .fire { margin-left: .4rem; }
  #wf-form { display: grid; gap: .5rem; margin-top: .6rem; }
  #wf-form[hidden] { display: none; }
  #wf-form label { font-size: .75rem; font-weight: 600; color: var(--muted); }
  #wf-form textarea {
    width: 100%; font: inherit; font-size: .875rem; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: .55rem .65rem; resize: vertical; min-height: 4.4rem;
  }

  /* Week calendar - the Schedule strip with dates and outcomes. A pill is done when a run
     for that workflow landed that day, missed when the day has passed without one. */
  .day.today .dayname { color: var(--ink); font-weight: 700; }
  .daydate { font-size: .68rem; color: var(--muted); font-weight: 400; }
  .pill .mark { font-size: .72rem; margin-left: .3rem; }
  .pill.done .mark { color: var(--ok, #3fb950); }
  .pill.missed { opacity: .55; }
  .pill.missed .mark { color: var(--bad, #d29922); }
  .cal-key { display: flex; gap: .9rem; flex-wrap: wrap; margin-top: .5rem; font-size: .72rem; color: var(--muted); }

  /* Board — four columns stack on a phone (one-handed rule), pair up on medium screens,
     and sit side by side only when there is genuinely room for four. */
  .board { display: grid; grid-template-columns: 1fr; gap: .6rem; }
  @media (min-width: 48rem) { .board { grid-template-columns: repeat(2, 1fr); align-items: start; } }
  @media (min-width: 64rem) { .board { grid-template-columns: repeat(4, 1fr); } }
  .board .col-title { display: flex; justify-content: space-between; align-items: baseline; padding: .55rem .9rem; border-bottom: 1px solid var(--line); font-size: .6875rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .board .kcard { padding: .6rem .9rem; border-bottom: 1px solid var(--line); font-size: .875rem; }
  .board .kcard:last-child { border-bottom: 0; }
  .board .kcard .summary { margin: .15rem 0 0; font-size: .8125rem; color: var(--muted); }
  .st { font-weight: 700; }
  .st-ok { color: var(--ok); }
  .st-partial, .st-blocked { color: var(--warn); }
  .st-failed { color: var(--bad); }

  /* Run list */
  .run { padding: .7rem .9rem; border-bottom: 1px solid var(--line); }
  .run:last-child { border-bottom: 0; }
  .run .summary { margin: .2rem 0 0; font-size: .875rem; color: var(--muted); }

  /* Measured in Chromium at 375x667: every other control on the board cleared 32px and this one
     was 34x17. It is also the only control that goes from a phone to the live transcript of a
     run, which makes it the worst one to have to aim at. */
  a.watch {
    display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 .5rem;
    margin: -.6rem 0; font-weight: 600;
  }

  /* Same measurement, same fix: a skill's name is the link that opens the file, and it was 23px
     tall. Anything on this page that is meant to be tapped gets the thumb target. */
  a.title[data-open] { display: inline-flex; align-items: center; min-height: 2.75rem; }

  h3.group { margin: 1.1rem 0 .1rem; font-size: .95rem; }
  .group-note { margin: 0 0 .45rem; }

  /* Team */
  .agent { padding: .85rem .9rem; border-bottom: 1px solid var(--line); }
  .agent:last-child { border-bottom: 0; }
  .agent p.desc { margin: .3rem 0 .45rem; color: var(--muted); font-size: .8125rem; }
  details.agent > summary { list-style: none; cursor: pointer; }
  details.agent > summary::-webkit-details-marker { display: none; }
  /* The card opens to show what this agent actually did. The marker above is hidden, and a
     `cursor: pointer` is invisible on the phone this board is built to be read on - so on the
     device that matters there was nothing at all saying a tap did anything. This is that sign. */
  .agent .runcount { display: block; margin-top: .35rem; color: var(--muted); font-size: .75rem; }
  .agent .chev { display: inline-block; margin-left: .35rem; transition: transform .15s ease; }
  details.agent[open] .chev { transform: rotate(90deg); }
  .agent-runs { margin-top: .6rem; border-top: 1px solid var(--line); }

  /* Memory */
  input[type=search] {
    width: 100%; font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); padding: .65rem .8rem;
  }
  /* Wraps rather than scrolling sideways. At 390px this row is 804px of chips in 358px, so SEVEN
     of the twelve filters sat off-screen - including `shared`, which holds the business brain and
     18 of this repo's 59 pages. Worse than the step chain on the Workflows screen, which at least
     stopped mid-word: a chip boundary happens to land near the edge, so the row looks finished. A
     horizontal scroller inside a page that scrolls down is missed by a thumb either way. */
  .filters { display: flex; flex-wrap: wrap; gap: .4rem; padding: .6rem 0; }
  /* A folder name too wide for one row has to break INSIDE the chip. The base .chip rule sets
     `white-space: nowrap`, and a flex item does not shrink below its content, so without this a
     single long folder name pushed straight out of the row - and since the wrap fix above removed
     `overflow-x: auto`, that overflow was no longer contained and the WHOLE PAGE gained a sideways
     scrollbar. The old scrolling version was locally bad; losing this made it globally bad.
     Measured: a 69-character folder name took the document to 490px against a 390px viewport.
     This is the same safeguard the step chain on the Workflows screen already uses, which is the
     precedent the wrap fix cites - it was cited without being copied. */
  .filters .chip { cursor: pointer; border: 1px solid transparent; white-space: normal; overflow-wrap: anywhere; }
  .filters .chip.on { border-color: var(--accent); color: var(--accent); }
  details.folder { border-bottom: 1px solid var(--line); }
  details.folder:last-child { border-bottom: 0; }
  details.folder > summary { padding: .65rem .9rem; cursor: pointer; font-weight: 600; font-size: .9rem; list-style: none; display: flex; justify-content: space-between; gap: .5rem; }
  details.folder > summary::-webkit-details-marker { display: none; }
  .file { display: flex; justify-content: space-between; gap: .5rem; padding: .5rem .9rem .5rem 1.5rem; font-size: .875rem; border-top: 1px solid var(--line); cursor: pointer; }
  .file:hover { background: var(--panel-2); }
  .file .idx { color: var(--accent); font-size: .6875rem; }

  /* Viewer overlay */
  #viewer { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; flex-direction: column; }
  #viewer.open { display: flex; }
  #viewer .bar { display: flex; align-items: center; gap: .75rem; padding: .8rem 1rem; border-bottom: 1px solid var(--line); }
  #viewer .bar .path { font-size: .8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #viewer pre { flex: 1; overflow: auto; margin: 0; padding: 1rem; font-size: .8125rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  #viewer button { font: inherit; color: var(--ink); background: var(--chip); border: 0; border-radius: 8px; padding: .4rem .8rem; }

  /* Connections */
  .conn { padding: .85rem .9rem; border-bottom: 1px solid var(--line); }
  .conn:last-child { border-bottom: 0; }

  .gap { padding: .7rem .9rem; border-bottom: 1px solid var(--line); font-size: .875rem; }
  .gap:last-child { border-bottom: 0; }
  .error { border-color: var(--bad); padding: 1rem 1.1rem; }
  .error h3 { margin-top: 0; color: var(--bad); }
  .problems { margin: .4rem 0 0; padding-left: 1.1rem; color: var(--warn); font-size: .8125rem; }
  footer { margin-top: 2rem; color: var(--muted); font-size: .75rem; }

  /* Top nav on a phone — the screens are the first thing you see, not the last */
  nav {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    background: rgba(13, 15, 19, .92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  /* Seven tabs used to sit in a six-column grid: the seventh wrapped to a second row while
     --nav-h still described one, so a strip of every page lived underneath the nav on every
     phone. Four per row, wrapping to a centred three, and --nav-h counts both rows. */
  nav .tabs { display: flex; flex-wrap: wrap; justify-content: center; max-width: 44rem; margin: 0 auto; }
  nav .tabs > a { flex: 0 0 25%; }
  nav a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1rem;
    height: var(--nav-row); color: var(--muted); font-size: .6875rem; font-weight: 600;
    letter-spacing: .02em; text-decoration: none;
  }
  nav a:hover { text-decoration: none; }
  nav a .glyph { font-size: 1.05rem; line-height: 1; font-weight: 400; }
  nav a.active { color: var(--accent); }

  /* "Talk to your team" — a plain link out to claude.ai/code, no API call behind it.
     In the header on every size; the sidebar copy only exists on desktop. */
  .talk-header { margin-left: auto; font-size: .8125rem; white-space: nowrap; }
  nav .talk { display: none; }

  /* Desktop: the same nav markup becomes a fixed LEFT sidebar; below 48rem nothing changes
     and the top bar stays exactly as it is. Pure CSS, no script involved. */
  @media (min-width: 48rem) {
    body { padding-top: 0; padding-bottom: 1.5rem; padding-left: var(--sidenav-w); }
    nav {
      top: 0; bottom: 0; right: auto; width: var(--sidenav-w);
      border-bottom: 0; border-right: 1px solid var(--line);
      padding-top: 0;
      display: flex; flex-direction: column;
    }
    nav .tabs {
      display: grid; grid-template-columns: 1fr; align-content: start;
      max-width: none; margin: 0; flex: 1; min-height: 0; padding-top: 1rem;
    }
    nav a {
      flex-direction: row; justify-content: flex-start; gap: .65rem;
      height: 3rem; padding: 0 1.1rem; font-size: .8125rem;
    }
    nav .talk {
      display: flex; flex: none; height: 3rem;
      border-top: 1px solid var(--line);
      color: var(--muted); font-weight: 600;
    }
    nav .talk:hover { color: var(--accent); }
  }

  /* Agent identity colors — set inline from AGENT_PALETTE. Identity (who owns this) is a
     left border / swatch / chip tint; health (working/quiet/attention) stays on the status
     dot and state label. The two never share an element. */
  .agent-accent { border-left: 3px solid transparent; }
  .swatch { width: .6rem; height: .6rem; border-radius: 3px; display: inline-block; flex: none; }

  /* Schedule strip — 7-day week, horizontal scroll on a phone inside its own container */
  .schedule-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(6.5rem, 1fr)); min-width: 45.5rem; }
  .week .day { border-left: 1px solid var(--line); padding: .45rem .45rem .6rem; min-height: 4.5rem; }
  .week .day:first-child { border-left: 0; }
  .week .day .dayname { font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: .3rem; }
  .pill {
    display: block; font-size: .6875rem; line-height: 1.3; border-radius: 6px;
    padding: .25rem .4rem; margin: 0 0 .3rem; background: var(--panel-2);
    border: 1px solid var(--line); border-left-width: 3px;
  }
  .pill .t { color: var(--muted); white-space: nowrap; }
  .sched-foot { border-top: 1px solid var(--line); padding: .5rem .9rem; font-size: .8125rem; }
  .sched-foot .pill { display: inline-block; margin: .15rem .35rem .15rem 0; }
  .legend { display: flex; flex-wrap: wrap; gap: .35rem .9rem; padding: .55rem .9rem; border-top: 1px solid var(--line); font-size: .75rem; color: var(--muted); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: .35rem; }
  .hero { text-align: center; padding: 1.6rem 1rem; }
  .hero-value { font-size: clamp(2.6rem, 9vw, 4.2rem); font-weight: 700; line-height: 1.05; }
  .hero-unit { font-size: 1rem; opacity: .85; margin-top: .2rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="screen-title">Today</h1>
    <span id="repo-link" class="small"></span>
    <a class="talk-header" href="https://claude.ai/code" target="_blank" rel="noreferrer noopener"
       title="Open a Claude session on your team repo - your orchestrator, your rules">Talk to your team</a>
  </header>
  <p class="sub" id="strap">Reading your repo…</p>

  <div id="today" class="screen active"><div class="panel empty">Loading.</div></div>
  <div id="ledger" class="screen"></div>
  <div id="team" class="screen"></div>
  <div id="workflows" class="screen"></div>
  <div id="skills" class="screen"></div>
  <div id="memory" class="screen"></div>
  <div id="connections" class="screen"></div>

  <footer id="foot"></footer>
</div>

<div id="viewer">
  <div class="bar">
    <button id="viewer-close" type="button">Back</button>
    <span class="path" id="viewer-path"></span>
    <a id="viewer-github" rel="noreferrer noopener" class="small">GitHub</a>
  </div>
  <pre id="viewer-body">Loading…</pre>
</div>

<nav>
  <div class="tabs">
    <a href="#today" data-screen="today"><span class="glyph">&#9679;</span>Today</a>
    <a href="#ledger" data-screen="ledger"><span class="glyph">&#9632;</span>Ledger</a>
    <a href="#team" data-screen="team"><span class="glyph">&#9670;</span>Team</a>
    <a href="#workflows" data-screen="workflows"><span class="glyph">&#9654;</span>Workflows</a>
    <a href="#skills" data-screen="skills"><span class="glyph">&#9881;</span>Skills</a>
    <a href="#memory" data-screen="memory"><span class="glyph">&#9632;</span>Memory</a>
    <a href="#connections" data-screen="connections"><span class="glyph">&#9673;</span>Connections</a>
  </div>
  <a class="talk" href="https://claude.ai/code" target="_blank" rel="noreferrer noopener"
     title="Open a Claude session on your team repo - your orchestrator, your rules"><span class="glyph">&#9998;</span>Talk to your team</a>
</nav>

<script>
'use strict'

/* One list, in nav order. TITLES was maintained by hand alongside SCREENS and lost `ledger`
   somewhere, so tapping Ledger - the screen the whole measured-week idea lives on - put the
   literal word "undefined" in the page header. Deriving one from the other makes a screen
   without a title unrepresentable rather than merely unlikely. */
const TITLES = { today: 'Today', ledger: 'Ledger', team: 'Team', workflows: 'Workflows', skills: 'Skills', memory: 'Memory', connections: 'Connections' }
const SCREENS = Object.keys(TITLES)
const STATE_LABEL = {
  working: 'Working', quiet: 'Gone quiet', 'never-run': 'Never run', attention: 'Needs a look',
  'not-in-use': 'Not in use',
  live: 'Live', silent: 'Silent', 'no-heartbeat': 'No heartbeat'
}

const el = (id) => document.getElementById(id)
const escapeHtml = (value) =>
  String(value ?? '').replace(/[&<>"']/g, (character) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character])

/* ---------- Agent identity colors + schedule expansion ----------
   KEEP IN SYNC: AGENT_PALETTE, agentColorIndex, and scheduleWeekView are mirrored verbatim
   as exports in api/lib.js, where the test suite exercises them (this page has no module
   loading). Change them here, change them there. */

// Eight distinct dark-theme-friendly hues. Agent color is IDENTITY only — status colors
// (ok/warn/bad) stay on dots and state labels, never on the same element as an agent color.
const AGENT_PALETTE = [
  { name: 'blue', hex: '#60a5fa' },
  { name: 'violet', hex: '#a78bfa' },
  { name: 'teal', hex: '#2dd4bf' },
  { name: 'amber', hex: '#facc15' },
  { name: 'rose', hex: '#fb7185' },
  { name: 'green', hex: '#34d399' },
  { name: 'cyan', hex: '#22d3ee' },
  { name: 'orange', hex: '#fb923c' }
]

// Deterministic slug → palette index. Hash: FNV-1a 32-bit over the slug's UTF-16 code
// units (offset basis 0x811c9dc5, prime 0x01000193, Math.imul for 32-bit wrap), then
// unsigned mod 8 — the same slug maps to the same color forever, with no stored state.
function agentColorIndex(slug) {
  const text = String(slug ?? '')
  let hash = 0x811c9dc5
  for (let index = 0; index < text.length; index += 1) {
    hash ^= text.charCodeAt(index)
    hash = Math.imul(hash, 0x01000193)
  }
  return (hash >>> 0) % AGENT_PALETTE.length
}

// Expands one schedule string into what the Schedule strip draws. Days are Monday-first:
// 0 = Mon … 6 = Sun. Unrecognised forms → null. (Mirrored in api/lib.js — see above.)
const WEEK_MON_FIRST = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun']

function scheduleWeekView(schedule) {
  if (typeof schedule !== 'string') return null
  const trimmed = schedule.trim()
  let match
  if (trimmed === 'hourly') return { type: 'interval', label: 'hourly' }
  if ((match = /^every (\d+) (minutes|hours)$/.exec(trimmed))) {
    return { type: 'interval', label: `every ${match[1]}${match[2] === 'hours' ? 'h' : 'm'}` }
  }
  if ((match = /^daily (\d{2}:\d{2})$/.exec(trimmed))) {
    return { type: 'days', days: [0, 1, 2, 3, 4, 5, 6], time: match[1] }
  }
  if ((match = /^weekdays (\d{2}:\d{2})$/.exec(trimmed))) {
    return { type: 'days', days: [0, 1, 2, 3, 4], time: match[1] }
  }
  if ((match = /^weekly (sun|mon|tue|wed|thu|fri|sat) (\d{2}:\d{2})$/.exec(trimmed))) {
    return { type: 'days', days: [WEEK_MON_FIRST.indexOf(match[1])], time: match[2] }
  }
  if ((match = /^monthly (\d{1,2}) (\d{2}:\d{2})$/.exec(trimmed))) {
    return { type: 'monthly', day: Number(match[1]), time: match[2] }
  }
  return null
}

/* Page-side helpers over the mirrored pure functions. The hex values are constants from
   AGENT_PALETTE above, never data from the repo — slugs, which are, stay escaped. */
const agentColor = (slug) => (slug ? AGENT_PALETTE[agentColorIndex(slug)].hex : null)
const accentStyle = (slug) => {
  const hex = agentColor(slug)
  return hex ? ` style="border-left-color:${hex}"` : ''
}
const ownerChipHtml = (slug) => {
  if (!slug) return ''
  const hex = agentColor(slug)
  return `<span class="chip" style="color:${hex};border:1px solid ${hex}">owner: ${escapeHtml(slug)}</span>`
}

function ago(iso) {
  if (!iso) return 'never'
  const seconds = (Date.now() - new Date(iso).getTime()) / 1000
  if (Number.isNaN(seconds)) return 'unknown'
  if (seconds < 3600) return `${Math.max(1, Math.round(seconds / 60))} min ago`
  if (seconds < 86400) return `${Math.round(seconds / 3600)} hr ago`
  const days = Math.round(seconds / 86400)
  return days === 1 ? 'yesterday' : `${days} days ago`
}

// Two places on this board exist purely to make an evidence claim believable - the snapshot
// banner and the footer - and both printed a raw toLocaleString: "as recorded 8/26/2026,
// 12:44:21 AM". Seconds serve nobody, and a bare date makes a reader do arithmetic to find out
// whether it is old. How long ago first, in words, with the exact moment kept in brackets.
function stamp(iso) {
  const date = new Date(iso)
  if (Number.isNaN(date.getTime())) return 'at an unreadable time'
  const exact = date.toLocaleString(undefined, {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
  })
  return `${ago(iso)} (${exact})`
}

function until(iso) {
  if (!iso) return null
  const seconds = (new Date(iso).getTime() - Date.now()) / 1000
  if (Number.isNaN(seconds)) return null
  if (seconds <= 0) return 'now'
  if (seconds < 3600) return `in ${Math.max(1, Math.round(seconds / 60))} min`
  if (seconds < 86400) return `in ${Math.round(seconds / 3600)} hr`
  return `in ${Math.round(seconds / 86400)} days`
}

/* ---------- Today ---------- */

function ladderHtml(setup) {
  const passed = setup.filter((rung) => rung.pass).length
  const rungs = setup.map((rung) =>
    `<div class="rung ${rung.pass ? 'pass' : ''}" title="${escapeHtml(rung.detail)}"><div class="bar"></div>${escapeHtml(rung.label)}</div>`
  ).join('')
  return `<h2>Setup &middot; ${passed} of ${setup.length} rungs</h2><div class="panel"><div class="ladder">${rungs}</div></div>`
}

function fireButtonsHtml(workflows) {
  const firing = workflows.filter((workflow) => workflow.fire)
  if (!firing.length) return ''
  // Each button POSTs /api/fire { workflow: slug } same-origin. The fire key never lives
  // in this page's source — the endpoint asks for it (401) and the prompt keeps it in
  // sessionStorage for this tab only. See fireWorkflow() below.
  const buttons = firing.map((workflow) =>
    `<button class="fire" type="button" data-fire="${escapeHtml(workflow.slug)}" data-action="run">
       &#9654; ${escapeHtml(workflow.name)}</button>`
  ).join('')
  return `<h2>Run a job</h2><div class="fires">${buttons}</div>
    <p class="small muted">Starts that job now rather than waiting for its schedule. It spends one run
    from your Claude account and leaves its work in your repo as a draft &mdash; nothing is sent
    anywhere and nothing is deleted.</p>`
}

// The Board lives here on Today, in the slot Overnight used to hold, rather than as a
// extra nav tab: the phone nav is already seven tabs across two rows, and each one added
// costs vertical space on every screen. Four per row at 375px is ~94px a tab, which fits the
// longest label and clears the 44px thumb target with room to spare.
// The Done column carries everything the Overnight feed used to show, and more.
const STATUS_GLYPH = { ok: '&#10003;', partial: '&#9680;', blocked: '&#9940;', failed: '&#10007;' }

function boardColumnHtml(title, cards, emptyText, extra = '') {
  const rows = cards.length
    ? cards.join('')
    : `<div class="empty">${escapeHtml(emptyText)}</div>`
  return `<div class="panel">
    <div class="col-title"><span>${escapeHtml(title)}</span><span>${cards.length}</span></div>
    ${extra}${rows}</div>`
}

// The inline Add-task form. Submitting POSTs /api/fire { action: "task", … } — the same
// client path as the Run buttons (prompt-once key, sessionStorage, PUBLIC_FIRE) — and the
// task-intake routine's session writes the card; this page still never writes the repo.
// Agent slugs come from the live team list; slugs are repo data, so they stay escaped.
function addTaskHtml() {

  ).join('')
  return `<div class="add-task">
    <button class="fire" type="button" id="task-open">+ Add task</button>
    <button class="fire" type="button" id="wf-open">+ New workflow</button>
    <form id="task-form" hidden>
      <label for="task-text">What do you want done?</label>
      <textarea id="task-text" rows="3" maxlength="2200"
        placeholder="e.g. Research podcast sponsors - or - Build me a skill that drafts YouTube descriptions"></textarea>
      <div class="row">
        <select id="task-for" aria-label="Who should do it">
          <option value="">Anyone — let the team route it</option>
          ${options}
        </select>
        <button class="fire" type="submit" id="task-send">Add</button>
      </div>
      <span class="fire-note" id="task-note"></span>
    </form>
    <form id="wf-form" hidden>
      <label for="wf-text">What job should run on its own?</label>
      <textarea id="wf-text" rows="3" maxlength="2200"
        placeholder="e.g. Every Monday at 7, check which clients went quiet and draft a message to each"></textarea>
      <span class="small muted">Say what it does and when. Your team writes the workflow and
        asks you anything it still needs.</span>
      <button class="fire" type="submit" id="wf-send">Request it</button>
      <span class="fire-note" id="wf-note"></span>
    </form>
  </div>`
}

function boardHtml(board) {
  // To do cards come from tasks/*.md in the team repo — read-only here. "+ Add task"
  // dispatches through /api/fire to the task-intake routine, whose session commits the
  // card; moving tasks stays with the agents. This page still never writes the repo.
  // The left border is the `for:` agent's identity color; no agent, no color.
  const todo = (board.todo ?? []).map((card) =>
    `<div class="kcard agent-accent"${accentStyle(card.for)}>
      <div class="row between">
        <b>${escapeHtml(card.title)}</b>
        ${card.doing ? '<span class="chip on">doing</span>' : ''}
      </div>
      ${ownerChipHtml(card.for)}
    </div>`)
  const upNext = board.upNext.map((card) =>
    `<div class="kcard agent-accent"${accentStyle(card.owner)}>
      <div class="row between">
        <b>${escapeHtml(card.name)}</b>
        <span class="small muted">${escapeHtml(until(card.when) ?? '')}</span>
      </div>
      ${ownerChipHtml(card.owner)}
    </div>`)
  const running = board.running.map((card) =>
    `<div class="kcard agent-accent"${accentStyle(card.agent)}>
      <div class="row between">
        <b>${escapeHtml(card.name)}</b>
        <span class="small muted">started ${escapeHtml(ago(card.started_at))}</span>
      </div>
      ${card.session_url ? `<a class="small watch" href="${escapeHtml(card.session_url)}" rel="noreferrer noopener">watch</a>` : ''}
    </div>`)
  const done = board.done.map((card) => {
    const glyph = STATUS_GLYPH[card.status] ?? '&#10003;'
    return `<div class="kcard agent-accent"${accentStyle(card.agent)}>
      <div class="row between">
        <span><span class="st st-${escapeHtml(card.status)}">${glyph}</span> <b>${escapeHtml(card.name)}</b></span>
        <span class="small muted">${escapeHtml(ago(card.started_at))}</span>
      </div>
      <p class="summary">${escapeHtml(card.summary)}${card.session_url ? ` &middot; <a class="watch" href="${escapeHtml(card.session_url)}" rel="noreferrer noopener">watch</a>` : ''}</p>
    </div>`
  })
  return `<div class="board">
    ${boardColumnHtml('To do', todo, 'No open tasks in tasks/ yet.', addTaskHtml())}
    ${boardColumnHtml('Up Next', upNext, 'Nothing scheduled in the next 48 hours.')}
    ${boardColumnHtml('Running', running, 'Nothing is running right now.')}
    ${boardColumnHtml('Done', done, 'No finished runs in the last 14 days.')}
  </div>`
}

/* ---------- The hero number ---------- */

/* One figure, at the top, and the only one on this board that says what somebody's week costs
   rather than what the agents did.

   tiles.yml has named `hero: hours-saved` since the day it was written, and nothing has ever
   computed it. So when the number cannot be produced this says so, plainly, instead of rendering
   a zero - a zero here is a claim about their week, made in the largest type on the screen. */

function heroHtml(hero) {
  if (!hero) return ''
  if (!hero.defined) {
    return `<div class="panel empty"><b>No hero number yet.</b> <span class="small">${escapeHtml(hero.why ?? '')}. Nothing is shown rather than a zero, because a zero here would be a claim about your week.</span></div>`
  }
  const value = hero.money
    ? '$' + Math.round(hero.value).toLocaleString('en-US')
    : (Math.round(hero.value * 10) / 10).toLocaleString('en-US')
  return `<div class="panel hero"><div class="hero-value">${escapeHtml(value)}</div>
    <div class="hero-unit">${escapeHtml(hero.unit ?? '')}</div>
    <div class="small muted">${escapeHtml(hero.caption ?? '')}</div></div>`
}

/* ---------- Ledger ---------- */

function renderLedger() {
  const ledger = data.ledger
  const proposals = data.proposals

  if (!ledger) {
    el('ledger').innerHTML =
      heroHtml(data.hero) +
      `<div class="panel empty"><b>No ledger yet.</b> <span class="small">Run <code>/ledger</code> in your
        team repo. It measures where your week actually goes, and everything on this screen is
        derived from it.</span></div>`
    return
  }

  /* The hero was guarded and this line was not, so the zero simply moved down the page: an empty
     ledger printed "0 hours a week - $0 a week at the rate you set" here instead. Same claim,
     same screen, one panel lower. Guarded at the source now, in the same terms. */
  const hoursKnown = Number.isFinite(ledger.hoursPerWeek) && ledger.hoursPerWeek > 0
  const costKnown = hoursKnown && !ledger.unpriced && Number.isFinite(ledger.costPerWeek)

  const money = ledger.unpriced
    ? '<span class="small muted">No rate recorded, so this is counted in hours only.</span>'
    : costKnown
      ? `<b>$${Math.round(ledger.costPerWeek).toLocaleString('en-US')}</b> a week at the rate you set`
      : '<span class="small muted">No cost, because there are no hours to cost.</span>'

  const unreadableNote = ledger.unreadable
    ? `<p class="small bad">${ledger.unreadable} row${ledger.unreadable === 1 ? '' : 's'} in your
       ledger could not be read as hours, so the total below is incomplete. Fix
       <code>ledger.yml</code> and re-run <code>npm run check:ledger</code>.</p>`
    : ''

  // Same defect as numberCitation had one repo along: round to a decimal, then print a bare number
  // in front of a hardcoded "hours". Somebody whose whole week rounds to exactly one hour - a
  // light week, which is most first weeks - read "1 hours a week" as the headline of this screen.
  const roundedHours = Math.round(ledger.hoursPerWeek * 10) / 10
  const weekHtml = hoursKnown
    ? `<div class="panel"><div class="gap"><b>${roundedHours}</b> hour${roundedHours === 1 ? '' : 's'} a week &middot; ${money}</div>
       ${unreadableNote}
       <p class="small muted">Your numbers, from <code>ledger.yml</code>. Disagree with any of it and the
       answer is to change that file - nothing here is a recommendation.</p></div>`
    : `<div class="panel empty"><b>Your ledger has no hours in it yet.</b>
       <span class="small">Nothing is shown rather than a zero, because a zero here would say your
       repeating work costs you nothing.</span>${unreadableNote}</div>`

  const tasksHtml = ledger.tasks.length
    ? `<div class="panel">${ledger.tasks.map((task) =>
        `<div class="gap"><b>${escapeHtml(task.task)}</b>
          <span class="small">${task.hoursPerWeek === null ? '' : (Math.round(task.hoursPerWeek * 10) / 10) + 'h'}</span>
          ${task.confirmed === 'once' ? '<span class="chip">said once</span>' : ''}
          ${task.parked ? '<span class="chip">parked</span>' : ''}
          <div class="small muted">&ldquo;${escapeHtml(task.words)}&rdquo;</div>
          ${
            task.parked
              ? `<div class="small muted">Parked: ${
                  task.parkedBecause
                    ? escapeHtml(task.parkedBecause)
                    : 'nobody is named to act on the result yet'
                }</div>`
              : ''
          }</div>`
      ).join('')}</div>`
    : `<div class="panel empty"><b>Your ledger names no tasks yet.</b> <span class="small">Run
       <code>/ledger</code> again and tell it what you actually repeat each week &mdash; everything
       proposed below is derived from those lines and nothing else.</span></div>`

  /* Every proposal shows all three citations, because the whole point is that it can be checked
     without trusting anybody - their words, their number, and a thing that already exists. */
  const proposalHtml = proposals && proposals.proposals.length
    ? proposals.proposals.map((row) =>
        `<div class="panel"><div class="row between"><b>${escapeHtml(row.task)}</b>
            <span class="chip">${escapeHtml(row.item)}</span></div>
          <div class="small">you said: &ldquo;${escapeHtml(row.words)}&rdquo;</div>
          <div class="small">that is: ${escapeHtml(row.number)}</div>
          ${row.why ? `<div class="small muted">why this one: ${escapeHtml(row.why)}</div>` : ''}
          <div class="gap"><button class="fire" type="button" data-approve="${escapeHtml(row.task)}">Approve</button>
            <span class="fire-note"></span>
            <div class="small muted">Records your decision in <code>proposals.yml</code>.
            Nothing is switched on and nothing is spent &mdash; arming is a separate step you take on
            purpose.</div></div></div>`
      ).join('')
    : '<div class="panel empty">No proposals yet. Run <code>/match</code> after your ledger is checked.</div>'

  /* The gaps are half the answer and the more useful half - they are the specification for what
     gets built next. Shown at the same weight as the proposals, never tucked away. */
  const gapHtml = !proposals
    ? `<div class="panel empty"><b>No gaps list yet.</b> <span class="small">Run <code>/match</code>
       in your team repo. Never having asked what your team cannot do is not the same as your team
       being able to do everything, so nothing is claimed here either way.</span></div>`
    : proposals.gaps.length
      ? `<div class="panel">${proposals.gaps.map((gap) =>
          `<div class="gap"><b>${escapeHtml(gap.task)}</b><div class="small muted">${escapeHtml(gap.question)}</div></div>`
        ).join('')}</div>`
      : `<div class="panel empty">Nothing on the gaps list &mdash; <code>/match</code> found
         something already in your repo for every line of your ledger.</div>`

  el('ledger').innerHTML =
    heroHtml(data.hero) +
    `<h2>Your week</h2>` + weekHtml +
    `<h2>What eats it</h2>` + tasksHtml +
    `<h2>Proposed</h2>` + proposalHtml +
    `<h2>Nothing on the team does these yet</h2>` + gapHtml
}

  const board = data.board ?? { todo: [], upNext: [], running: [], done: [] }
  const due = data.workflows
    .filter((workflow) => workflow.nextRun && new Date(workflow.nextRun).getTime() - Date.now() <= 86400000)

  const dueHtml = due.length
    ? `<div class="panel">${due.map((workflow) =>
        `<div class="gap row between"><span><b>${escapeHtml(workflow.name)}</b> <span class="small muted">${escapeHtml(workflow.schedule ?? '')}</span></span><span class="small">${escapeHtml(until(workflow.nextRun) ?? '')}</span></div>`
      ).join('')}</div>`
    : `<div class="panel empty">Nothing scheduled in the next 24 hours.</div>`

  /* An empty quiet list used to print "Everything scheduled is running". On a repo where nine
     files declare a schedule and no routine exists, nothing CAN go quiet - and the board was
     reporting all clear about jobs that had never been switched on. That is precisely the claim
     this whole product exists to refuse, printed on its own front page. */
  const ringing = data.workflows.filter((workflow) => workflow.arm === 'armed').length
  const quietHtml = data.goneQuiet.length
    ? `<div class="panel">${data.goneQuiet.map((item) =>
        `<div class="gap"><b>${escapeHtml(item.name)}</b> <span class="chip">${escapeHtml(item.kind)}</span> <span class="small muted">last ran ${escapeHtml(ago(item.lastRun))}</span></div>`
      ).join('')}</div>`
    : ringing
      ? `<div class="panel empty">Nothing has gone quiet. All ${ringing} armed job${ringing === 1 ? '' : 's'}
         ran when ${ringing === 1 ? 'it was' : 'they were'} last due.</div>`
      : `<div class="panel empty"><b>Nothing can go quiet yet.</b> <span class="small">No job on this
         team is armed, so there is nothing scheduled to miss. That is not the same as everything
         running.</span></div>`

  // The snapshot banner belongs here too. Today is the first screen anybody opens, and it was the
  // one place a month-old snapshot was presented with no age at all.
  el('today').innerHTML =
    heroHtml(data.hero) +
    snapshotBannerHtml(data.routines) +
    ladderHtml(data.setup) +
    fireButtonsHtml(data.workflows) +
    `<h2>Board</h2>` + boardHtml(board) +
    `<h2>Due next</h2>` + dueHtml +
    `<h2>Gone quiet</h2>` + quietHtml +
    // The week, last: what is scheduled, what already ran, what was due and did not.
    scheduleStripHtml(data.workflows, { dates: true, runs: data.runs, heading: 'This week' }) +
    // Spec B.2: remaining routine runs are linked, never scraped — there is no API for them.
    `<h2>Usage</h2><div class="panel"><p class="small">Remaining routine runs live on your
      <a href="https://claude.ai/settings/usage" rel="noreferrer noopener">claude.ai usage page</a> —
      the dashboard links there rather than guessing.</p></div>`
}
