    display: flex; align-items: center; min-height: 2.75rem; padding: .4rem 1.05rem; cursor: pointer;
    list-style: none; font-weight: 600; font-size: .9375rem;
  }
  .copy-card > summary::-webkit-details-marker { display: none; }
  .copy-card > summary::after {
    content: ""; width: .38rem; height: .38rem; margin: -.15rem 0 0 auto;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg);
  }
  .copy-card[open] > summary::after { transform: rotate(225deg); margin-top: .2rem; }
  .copy-card > summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: var(--radius); }
  .copy-body { display: grid; gap: .6rem; max-width: 48rem; padding: 0 1.05rem 1rem; }
  .copy-body p { margin: 0; }
  .copy-intro { font-size: .875rem; max-width: 62ch; }
  .copy-variant { display: grid; gap: .4rem; padding-top: .7rem; border-top: 1px solid var(--line); min-width: 0; }
  .copy-os { font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .copy-lead { font-size: .8125rem; overflow-wrap: anywhere; }
  .copy-text {
    margin: 0; padding: .7rem .8rem; border-radius: var(--radius-sm); background: var(--chip); color: var(--ink);
    font-size: .8125rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .copy-btn, .hermes-open {
    justify-self: start; display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0 1rem;
    font: inherit; font-size: .875rem; font-weight: 600; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer;
  }
  .hermes-open { color: var(--link); }
  .copy-btn:hover, .hermes-open:hover { text-decoration: none; border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .copy-btn:focus-visible, .hermes-open:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  /* The owner's number on the Ledger is the same card as on Today, on its own. Capped, because one
     card stretched across a laptop is a band of colour with a number lost at its left end. */
  .kpis-one { max-width: 26rem; }

  /* Ledger: the week's hours as the first thing on the panel, at a size between a line of text and
     a number card. The approve block is the decision under a proposal, ruled off from the three
     citations above it. */
  .week-line { font-size: .9375rem; }
  .week-line > b:first-child { font-size: 1.6rem; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .approve { margin-top: .75rem; padding-top: .75rem; border-top: 1px solid var(--line); }
  .approve .fire-note { margin-left: .5rem; }

  /* The number fades from the ink into the card's colour, where the browser can paint text with a
     background; anywhere it cannot, the plain ink above stands. */
  @supports ((-webkit-background-clip: text) or (background-clip: text)) {
    .kpi-value, .kpi .hero-value {
      background: linear-gradient(180deg, var(--ink), color-mix(in srgb, var(--kpi) 70%, var(--ink)));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
  }

  /* More room for the banner on a wide screen. Below the rules it overrides, as every override in
     this sheet has to be. */
  @media (min-width: 48rem) {
    .banner { min-height: 15rem; border-radius: 22px; }
    .banner-text { padding: 1.6rem 1.9rem; }
    /* Beside the setup pill a laptop has about 830px for the greeting; at 2.6rem the last word of
       "Here is where things stand." fell onto a line of its own. */
    .banner .greeting, .banner .headline { font-size: clamp(1.6rem, 2.5vw, 2.25rem); }
    .kpis { gap: 1rem; margin: 1.1rem 0 1.25rem; }
  }
  /* One column under 1024px, then the grids (layout.test.mjs). auto-fit and auto-fill so the
     sidebar's width needs no query of its own: three number cards, two plan cards and three or four
     agent cards across a laptop. Below the one-column rules they override. */
  @media (min-width: 64rem) {
    .kpis { grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    .plan-cards { grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
    .team-grid { grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  }
  /* Talk to the board: the orb, bottom-right on every screen, and the sheet above it. The dock is the
     width of the screen less a gutter each side, so the sheet can be too on a phone; it lets taps
     through to the page everywhere but on the orb and the sheet themselves. Above the phone's home
     bar, and clear of the nav, which is at the top. */
  .voice-dock {
    position: fixed; left: 1rem; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 15;
    display: flex; flex-direction: column; align-items: flex-end; gap: .6rem; pointer-events: none;
  }
  .voice-dock > * { pointer-events: auto; }
  /* Room at the end of the page, so the orb never sits over the last thing on it - and, while the
     sheet is open, room for the sheet as well (its tallest, the orb under it and the home bar), so
     the Voice spend card and the footer can still be scrolled clear of it during a call. */
  .voice-on .wrap { padding-bottom: 5.5rem; }
  .voice-open .wrap { padding-bottom: calc(min(60vh, 28rem) + 6rem + env(safe-area-inset-bottom, 0px)); }
  .voice-orb {
    width: 3.5rem; height: 3.5rem; min-width: 2.75rem; min-height: 2.75rem; padding: 0; flex: none;
    display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    border: 2px solid var(--accent); background: var(--panel); color: var(--accent); box-shadow: var(--shadow);
  }
  .voice-orb .ico { width: 1.5rem; height: 1.5rem; }
  .voice-orb:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
  /* Each state has a shape of its own as well as its words, so colour is never the only sign: a
     broken ring while it connects or thinks, a still ring while it listens, filled while it speaks. */
  .voice-orb[data-state="connecting"], .voice-orb[data-state="thinking"] { border-style: dashed; }
  .voice-orb[data-state="listening"] { box-shadow: 0 0 0 .3rem color-mix(in srgb, var(--accent) 35%, transparent); }
  .voice-orb[data-state="speaking"] { background: var(--accent); color: var(--panel); }
  .voice-orb[data-state="error"] { border-color: var(--warn); color: var(--warn); }
  .voice-orb[aria-disabled="true"] { border-color: var(--line); color: var(--muted); cursor: default; }
  .voice-sheet {
    width: 100%; max-height: min(60vh, 28rem); overflow-y: auto; margin: 0; padding: .9rem 1rem;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .voice-state { margin: 0 0 .5rem; font-weight: 600; white-space: pre-line; }
  .voice-line { margin: 0 0 .5rem; font-size: .875rem; }
  .voice-who { display: block; font-size: .6875rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .voice-said { display: block; overflow-wrap: anywhere; }
  .voice-cost, .voice-mouth { margin: 0 0 .5rem; font-size: .8125rem; color: var(--muted); }
  .voice-note { margin: 0 0 .5rem; font-size: .8125rem; }
  .voice-note:empty { display: none; }
  .voice-stop { margin-top: .25rem; }
  .voice-mode { margin: 0 0 .5rem; font-size: .8125rem; }
  .voice-toggle { margin: 0 .5rem .5rem 0; }
  .voice-toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  /* Voice spend, in Today's Usage section under Subscriptions. "estimate" is a chip in plain view. */
  .voice-spend { margin-top: .75rem; padding: .9rem 1.05rem; }
  .voice-spend .title { margin: 0 0 .4rem; }
  .voice-spend-total { margin: 0 0 .35rem; font-size: .9375rem; }
  .voice-spend-line { margin: 0 0 .35rem; font-size: .8125rem; }
  .voice-spend-warn { margin: 0 0 .35rem; font-size: .8125rem; color: var(--warn); }
  .voice-spend-note { margin: .5rem 0 0; font-size: .75rem; color: var(--muted); }
  /* From 1024px the sheet is docked beside the orb at a reading width. */
  @media (min-width: 64rem) {
    .voice-sheet { width: 22rem; }
  }

  /* Motion - every moving rule on the board, and nowhere else (plan 2026-10-10, section 3).
     One block, for someone whose device has not asked for less motion: written this way round, a
     device that asks for less never meets a moving rule, rather than meeting one and a second rule
     that has to switch it off. At the END of the sheet, because a media query adds no specificity and
     these override rules above. Under reduce nothing here exists, and every state still differs by
     shape and words. tests/motion.test.mjs holds all of this. */
  @media (prefers-reduced-motion: no-preference) {
    .agent-card .chev, .why > summary::after, .found-group > summary::after { transition: transform var(--dur-1) var(--ease-std); }
    .theme-switch::after { transition: transform var(--dur-2) var(--ease-std); }

    /* A slow drift across the sidebar's picture, only where the picture shows at all. */
    @keyframes side-art-drift {
      from { transform: scale(1.35) translateX(0); }
      to { transform: scale(1.35) translateX(-9%); }
    }
    @media (min-width: 48rem) and (min-height: 46rem) {
      .side-art img { animation: side-art-drift var(--dur-drift) ease-in-out infinite alternate; }
    }

    /* The orb's ring breathes while it listens. While it speaks, the glow follows how loud the reply
       really is: --voice-level, 0 to 1, which the page writes only on a device like this one. */
    @keyframes voice-pulse {
      0%, 100% { box-shadow: 0 0 0 .3rem color-mix(in srgb, var(--accent) 35%, transparent); }
      50% { box-shadow: 0 0 0 .7rem color-mix(in srgb, var(--accent) 10%, transparent); }
    }
    .voice-orb[data-state="listening"] { animation: voice-pulse var(--dur-ripple) ease-in-out infinite; }
    .voice-orb[data-state="speaking"] {
      box-shadow: 0 0 0 calc(.15rem + var(--voice-level, 0) * .75rem) color-mix(in srgb, var(--accent) 30%, transparent), var(--shadow);
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="crumb">
      <h1 id="screen-title">Today</h1>
      <span id="repo-link" class="small"></span>
      <span id="fresh" class="fresh" hidden><span class="fresh-dot" aria-hidden="true"></span><span id="fresh-text" class="fresh-text"></span></span>
    </div>
    <!-- Takes you to the Run a job buttons on Today. It never runs anything itself: pressing one of
         those buttons is still the person's own decision. Hidden when no job has a button. -->
    <a id="jump-run" class="topbar-btn" href="#today" title="Go to the Run a job buttons on Today" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5l12 7.5-12 7.5z"/></svg><span class="btn-label">Run a job</span></a>
    <!-- A plain link out to claude.ai/code, no API call behind it. -->
    <a class="topbar-btn" href="https://claude.ai/code" target="_blank" rel="noreferrer noopener"
       title="Open a Claude session on your team repo - your orchestrator, your rules"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg><span class="btn-label">Talk to your team</span></a>
    <!-- aria-checked is set by the script from the theme actually showing, before anyone can reach it. -->
    <button type="button" id="theme-switch" class="theme-switch" role="switch" aria-checked="false"
      aria-label="Light theme" title="Light or dark"></button>
  </header>
  <p class="sub" id="strap">Reading your repo…</p>

  <div id="today" class="screen active"><div class="panel empty">Loading.</div></div>
  <div id="ledger" class="screen"></div>
  <div id="team" class="screen"></div>
  <div id="workflows" class="screen"></div>
  <div id="readiness" class="screen"></div>
  <div id="skills" class="screen"></div>
  <div id="memory" class="screen"></div>
  <div id="connections" class="screen"></div>
  <div id="hermes" class="screen"></div>

  <footer id="foot"></footer>
  <!-- Signing out. Under every screen, never inside one: the screens are redrawn. -->
  <p class="session-actions">
    <button type="button" class="link-button" id="sign-out">Sign out</button>
    <button type="button" class="link-button" id="sign-out-everywhere">Sign out everywhere</button>
    <span id="session-note" class="fire-note bad" role="status" aria-live="polite"></span>
  </p>
</div>

<div id="viewer">
  <div class="bar">
    <button id="viewer-close" type="button">Back</button>
    <span class="path" id="viewer-path"></span>
    <a id="viewer-github" rel="noreferrer noopener" class="small">GitHub</a>
